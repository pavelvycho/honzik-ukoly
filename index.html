<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FBF7EF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikona-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="ikona-192.png">
</head>
<body>
<title>Honzíkovy úkoly</title>

<style>
/* ---------- barvy: inkoust na papíře, stejný svět jako tištěné listy ---------- */
:root{
  --papir:#FBF7EF;
  --karta:#FFFDF8;
  --ink:#241F1A;
  --ink2:#7D7266;
  --linka:#DCD2C1;
  --zelena:#3E8B5B;
  --cervena:#C5533B;
  --zluta:#DDA12A;
  --modra:#3C6FA6;
  --stin:#CBBDA4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papir:#15130F;
    --karta:#211D18;
    --ink:#F4EDE1;
    --ink2:#A2978A;
    --linka:#3B342B;
    --zelena:#5FB37E;
    --cervena:#E0745B;
    --zluta:#EBBB57;
    --modra:#6C9CD0;
    --stin:#0D0B09;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --papir:#15130F; --karta:#211D18; --ink:#F4EDE1; --ink2:#A2978A;
  --linka:#3B342B; --zelena:#5FB37E; --cervena:#E0745B; --zluta:#EBBB57;
  --modra:#6C9CD0; --stin:#0D0B09; color-scheme: dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:var(--papir);
  color:var(--ink);
  font-family:Pismo,"Segoe UI",system-ui,-apple-system,sans-serif;
  font-weight:400;
  overscroll-behavior:none;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--modra);outline-offset:3px}

#app{height:100%;display:flex;flex-direction:column}

/* ---------- horní lišta ---------- */
#lista{
  flex:0 0 auto;
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;
  border-bottom:2px solid var(--linka);
  background:var(--karta);
}
#zpet{
  width:44px;height:44px;flex:0 0 auto;
  border:2.5px solid var(--ink);border-radius:14px;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 3px 0 var(--stin);
}
#zpet.vid{display:flex}
#zpet:active{transform:translateY(3px);box-shadow:none}
#nadpis{
  flex:1;min-width:0;
  font-weight:700;font-size:clamp(17px,2.4vw,22px);
  letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.odznak{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  font-weight:700;font-size:16px;
  border:2.5px solid var(--ink);border-radius:999px;
  padding:5px 13px 5px 10px;
  box-shadow:0 3px 0 var(--stin);
}
#zvuk{
  width:44px;height:44px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  border:2.5px solid var(--ink);border-radius:14px;
  box-shadow:0 3px 0 var(--stin);
}

/* přepínač obtížnosti – jen na úvodní obrazovce, ať ho nikdo
   nepřeklikne uprostřed hry */
#uroven{
  display:none;flex:0 0 auto;gap:0;
  border:2.5px solid var(--ink);border-radius:999px;
  box-shadow:0 3px 0 var(--stin);overflow:hidden;
}
#app.domovska #uroven{display:flex}
#uroven button{
  padding:7px 14px;font-size:13px;font-weight:600;
  color:var(--ink2);background:transparent;
}
#uroven button[aria-pressed="true"]{background:var(--ink);color:var(--papir)}
@media (max-width:600px){
  #app.domovska #nadpis{display:none}
  #uroven button{padding:7px 11px;font-size:12px}
}

/* ---------- scéna ---------- */
#scena{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:16px;
  display:flex;flex-direction:column;
}
.wrap{width:100%;max-width:860px;margin:0 auto;flex:1;
      display:flex;flex-direction:column;gap:14px}

/* ---------- domovská obrazovka ---------- */
.uvod{text-align:center;padding:6px 0 2px}
.uvod h2{margin:0 0 4px;font-size:clamp(22px,4vw,30px);font-weight:700;
         letter-spacing:-.02em;text-wrap:balance}
.uvod p{margin:0;color:var(--ink2);font-size:14px;line-height:1.5}

/* nabídka přidat appku na plochu – objeví se, až to prohlížeč dovolí */
.instalace{
  display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  border:2.5px dashed var(--ink);border-radius:18px;
  padding:12px 16px;
}
.instalace span{font-size:14px;font-weight:600}

/* devět dlaždic: na tabletu 3×3 beze zbytku, na telefonu dva sloupce
   a poslední dlaždice přes celou šířku, ať nezůstane osamocená */
.dlazdice{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media (min-width:620px){
  .dlazdice{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:619px){
  .dlazdice > :last-child{grid-column:span 2}
}
.hra-t{
  background:var(--karta);
  border:2.5px solid var(--ink);
  border-radius:20px;
  box-shadow:0 4px 0 var(--stin);
  padding:18px 12px 15px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:transform .12s ease,box-shadow .12s ease;
}
.hra-t:active{transform:translateY(4px);box-shadow:0 0 0 var(--stin)}
.hra-t .jm{font-weight:700;font-size:15px;text-align:center;line-height:1.25}
.hra-t .kat{
  font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink2);
}
.hra-t svg{display:block}

/* ---------- zadání ---------- */
.zadani{
  display:flex;align-items:center;gap:10px;
  background:var(--karta);
  border:2.5px solid var(--ink);border-radius:16px;
  box-shadow:0 4px 0 var(--stin);
  padding:11px 14px;
}
.zadani p{margin:0;flex:1;font-weight:600;font-size:clamp(15px,2vw,18px);line-height:1.3}
.zadani button{
  flex:0 0 auto;width:40px;height:40px;border-radius:12px;
  border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;
}

/* ---------- herní plocha ---------- */
.plocha{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;
        min-height:0;padding:4px 0}

.volby{display:grid;gap:12px}
.volba{
  background:var(--karta);
  border:3px solid var(--ink);
  border-radius:22px;
  box-shadow:0 5px 0 var(--stin);
  min-height:clamp(104px,17vh,168px);
  display:flex;align-items:center;justify-content:center;
  padding:12px;
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;
}

/* velikosti obrázků – ať jsou na tabletu pořádně velké */
.hra-t svg{width:clamp(46px,7vw,72px);height:auto}
.volba svg{width:clamp(58px,11vw,112px);height:auto}
.vzor svg,.vzor.plny svg{width:clamp(68px,13vw,124px);height:auto}
.ram svg{width:clamp(34px,6vw,60px);height:auto}
.pole svg{width:clamp(30px,5.5vw,58px);height:auto}
.karta svg{width:clamp(38px,8vw,76px);height:auto}
.karta .rub svg{width:clamp(24px,4vw,38px)}
.skupina svg{width:clamp(30px,5.5vw,56px);height:auto}
.volba:active{transform:translateY(4px);box-shadow:0 0 0 var(--stin)}
.volba.ok{border-color:var(--zelena);animation:buch .45s ease}
.volba.ne{border-color:var(--cervena);animation:klepani .4s ease}
.volba.zhasle{opacity:.32}
.volba .cis{font-size:clamp(34px,7vw,52px);font-weight:700;line-height:1}

.ram{
  background:var(--karta);
  border:3px solid var(--ink);border-radius:20px;
  box-shadow:0 4px 0 var(--stin);
  padding:14px;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:10px;min-height:clamp(110px,16vh,160px);
}
.vzor{
  background:var(--karta);
  border:3px dashed var(--linka);border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  padding:14px;min-height:clamp(112px,17vh,168px);
}
.vzor.plny{border-style:solid;border-color:var(--ink);box-shadow:0 4px 0 var(--stin)}

@keyframes buch{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}
@keyframes klepani{0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ---------- postup ---------- */
.postup{display:flex;gap:7px;justify-content:center;padding:2px 0 4px;flex-wrap:wrap}
.tecka{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--ink);
       background:transparent}
.tecka.hot{background:var(--zelena);border-color:var(--zelena)}
.tecka.ted{background:var(--ink)}

/* ---------- razítko ---------- */
#razitko{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  pointer-events:none;z-index:50;
}
#razitko.vid{display:flex}
#razitko svg{animation:otisk .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes otisk{0%{transform:scale(.3) rotate(-22deg);opacity:0}
  55%{transform:scale(1.12) rotate(-7deg);opacity:1}
  100%{transform:scale(1) rotate(-7deg);opacity:1}}

/* ---------- odměna ---------- */
.odmena{flex:1;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:18px;text-align:center}
.odmena h2{margin:0;font-size:clamp(26px,6vw,40px);font-weight:700;letter-spacing:-.02em}
.odmena p{margin:0;color:var(--ink2);font-size:15px;max-width:34ch;line-height:1.5}
.hvezdy-rada{display:flex;gap:10px}
.hvezdy-rada svg{animation:skok .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes skok{from{transform:scale(0) rotate(-40deg);opacity:0}}
.tlacitka{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tl{
  border:3px solid var(--ink);border-radius:16px;
  box-shadow:0 4px 0 var(--stin);
  padding:13px 22px;font-weight:700;font-size:16px;background:var(--karta);
}
.tl:active{transform:translateY(4px);box-shadow:0 0 0 var(--stin)}
.tl.hl{background:var(--ink);color:var(--papir)}

/* ---------- pexeso ---------- */
.karty{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:600px;
       margin:0 auto;width:100%}
.popis-plochy{font-size:11px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink2);text-align:center;margin-bottom:6px}
.karta{
  aspect-ratio:1;border:3px solid var(--ink);border-radius:18px;
  background:var(--karta);box-shadow:0 4px 0 var(--stin);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.karta .rub{position:absolute;inset:0;display:flex;align-items:center;
            justify-content:center;background:var(--ink);color:var(--papir)}
.karta.otoc .rub{display:none}
.karta.nalez{border-color:var(--zelena);opacity:.55}

/* ---------- kreslení ---------- */
.platno-box{
  flex:1;min-height:230px;border:3px solid var(--ink);border-radius:20px;
  box-shadow:0 4px 0 var(--stin);background:var(--karta);overflow:hidden;
  position:relative;touch-action:none;
}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ---------- mřížky rozdílů ---------- */
.dvojplocha{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:520px){.dvojplocha{grid-template-columns:1fr}}
.mrizka9{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pole{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:12px;border:2px solid transparent;
}
.pole.klik:active{transform:scale(.94)}
.pole.ok{border-color:var(--zelena);background:color-mix(in srgb,var(--zelena) 14%,transparent)}
.pole.ne{animation:klepani .4s ease}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<div id="app">
  <header id="lista">
    <button id="zpet" aria-label="Zpět na výběr">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5 L8 12 L15 19"/></svg>
    </button>
    <h1 id="nadpis">Honzíkovy úkoly</h1>
    <div id="uroven" role="group" aria-label="Obtížnost">
      <button data-u="snadna" aria-pressed="true">snadné</button>
      <button data-u="tezka" aria-pressed="false">těžší</button>
    </div>
    <button id="zvuk" aria-label="Zapnout nebo vypnout zvuk"></button>
    <span class="odznak" id="skore"></span>
  </header>
  <main id="scena"></main>
</div>
<div id="razitko" aria-hidden="true"></div>

<script>
/* =====================================================================
   Honzíkovy úkoly — devět her pro předškoláka.
   Celé je to jeden soubor, žádné externí knihovny, funguje i offline.
   ===================================================================== */

8 Z\"/> <path d=\"M50 88 C46 62 40 40 32 24\"/> <path d=\"M46 66 L62 58\"/> <path d=\"M41 50 L56 42\"/>", "slunce": "<circle cx=\"50\" cy=\"50\" r=\"21\"/> <path d=\"M50 20 L50 8\"/><path d=\"M50 80 L50 92\"/> <path d=\"M20 50 L8 50\"/><path d=\"M80 50 L92 50\"/> <path d=\"M29 29 L20 20\"/><path d=\"M71 71 L80 80\"/> <path d=\"M71 29 L80 20\"/><path d=\"M29 71 L20 80\"/>", "mrak": "<path d=\"M30 74 C17 74 13 58 25 52 C25 36 44 30 52 42 C60 30 79 35 79 50 C90 53 89 74 76 74 Z\"/>", "kapka": "<path d=\"M50 12 C50 12 76 44 76 60 C76 75 64 86 50 86 C36 86 24 75 24 60 C24 44 50 12 50 12 Z\"/>", "ryba": "<path d=\"M16 50 C28 32 56 30 74 50 C56 70 28 68 16 50 Z\"/> <path d=\"M74 50 L92 34 L92 66 Z\"/> <circle cx=\"32\" cy=\"45\" r=\"3.5\" fill=\"currentColor\" stroke=\"none\"/> <path d=\"M48 36 C52 44 52 56 48 64\"/>", "motyl": "<path d=\"M50 28 L50 76\"/> <path d=\"M50 28 L40 15\"/><path d=\"M50 28 L60 15\"/> <path d=\"M48 34 C36 18 14 22 17 40 C20 54 37 52 48 45 Z\"/> <path d=\"M52 34 C64 18 86 22 83 40 C80 54 63 52 52 45 Z\"/> <path d=\"M48 52 C36 48 19 54 24 68 C29 80 43 73 48 62 Z\"/> <path d=\"M52 52 C64 48 81 54 76 68 C71 80 57 73 52 62 Z\"/>", "beruska": "<circle cx=\"50\" cy=\"58\" r=\"28\"/> <circle cx=\"50\" cy=\"28\" r=\"12\"/> <path d=\"M50 30 L50 86\"/> <circle cx=\"36\" cy=\"48\" r=\"5\" fill=\"currentColor\" stroke=\"none\"/> <circle cx=\"64\" cy=\"48\" r=\"5\" fill=\"currentColor\" stroke=\"none\"/> <circle cx=\"36\" cy=\"68\" r=\"5\" fill=\"currentColor\" stroke=\"none\"/> <circle cx=\"64\" cy=\"68\" r=\"5\" fill=\"currentColor\" stroke=\"none\"/> <path d=\"M44 18 L38 8\"/><path d=\"M56 18 L62 8\"/>", "ptak": "<path d=\"M20 56 C20 38 40 28 58 33 L74 22 L72 37 C84 44 84 62 72 70 C56 80 28 75 20 56 Z\"/> <path d=\"M40 52 C48 44 60 44 67 52 C59 61 47 61 40 52 Z\"/> <path d=\"M20 56 L7 51 L18 66\"/> <circle cx=\"58\" cy=\"43\" r=\"3.5\" fill=\"currentColor\" stroke=\"none\"/>", "auto": "<path d=\"M10 66 L10 50 L22 50 L32 32 L62 32 L74 50 L90 50 L90 66 Z\"/> <circle cx=\"29\" cy=\"68\" r=\"10\"/> <circle cx=\"71\" cy=\"68\" r=\"10\"/> <path d=\"M38 50 L38 34\"/>", "lod": "<path d=\"M12 64 L88 64 L76 82 L24 82 Z\"/> <path d=\"M50 62 L50 12\"/> <path d=\"M54 18 L54 58 L80 58 Z\"/> <path d=\"M46 26 L46 58 L26 58 Z\"/>", "letadlo": "<path d=\"M50 10 C57 20 59 32 59 44 L88 62 L88 70 L59 61 L59 74 L68 82 L68 90 L50 85 L32 90 L32 82 L41 74 L41 61 L12 70 L12 62 L41 44 C41 32 43 20 50 10 Z\"/>", "dum": "<path d=\"M14 52 L50 20 L86 52\"/> <path d=\"M24 46 L24 86 L76 86 L76 46\"/> <path d=\"M42 86 L42 62 L58 62 L58 86\"/> <rect x=\"30\" y=\"52\" width=\"14\" height=\"14\"/>", "mic": "<circle cx=\"50\" cy=\"50\" r=\"32\"/> <path d=\"M26 28 C40 42 40 58 26 72\"/> <path d=\"M74 28 C60 42 60 58 74 72\"/>", "hrnek": "<path d=\"M24 32 L24 74 C24 81 29 86 36 86 L58 86 C65 86 70 81 70 74 L70 32 Z\"/> <path d=\"M70 44 C85 44 85 66 70 66\"/> <path d=\"M36 22 C40 16 36 12 38 6\"/> <path d=\"M52 22 C56 16 52 12 54 6\"/>", "destnik": "<path d=\"M10 52 C10 28 28 12 50 12 C72 12 90 28 90 52\"/> <path d=\"M10 52 C18 44 27 60 37 52 C46 45 54 60 63 52 C72 44 81 60 90 52\"/> <path d=\"M50 52 L50 78 C50 87 38 89 34 82\"/> <path d=\"M50 12 L50 4\"/>", "klic": "<circle cx=\"28\" cy=\"50\" r=\"17\"/> <circle cx=\"28\" cy=\"50\" r=\"7\"/> <path d=\"M45 50 L90 50\"/> <path d=\"M78 50 L78 64\"/> <path d=\"M66 50 L66 62\"/>", "balon": "<path d=\"M50 10 C66 10 77 25 77 41 C77 58 62 72 50 76 C38 72 23 58 23 41 C23 25 34 10 50 10 Z\"/> <path d=\"M44 76 L56 76 L50 84 Z\"/> <path d=\"M50 84 C58 89 42 92 50 97\"/>", "kruh": "<circle cx=\"50\" cy=\"50\" r=\"32\"/>", "ctverec": "<rect x=\"19\" y=\"19\" width=\"62\" height=\"62\" rx=\"4\"/>", "trojuhelnik": "<path d=\"M50 14 L88 82 L12 82 Z\"/>", "hvezda": "<path d=\"M50 10 L61 38 L91 39 L67 57 L76 86 L50 69 L24 86 L33 57 L9 39 L39 38 Z\"/>", "srdce": "<path d=\"M50 86 C18 64 12 44 23 31 C34 19 48 25 50 38 C52 25 66 19 77 31 C88 44 82 64 50 86 Z\"/>", "kosoctverec": "<path d=\"M50 12 L86 50 L50 88 L14 50 Z\"/>"};
const NAZVY = {"jablko": "jablko", "hruska": "hruška", "banan": "banán", "tresne": "třešně", "hrozen": "hrozen", "strom": "strom", "jehlicnan": "smrk", "kvetina": "květina", "list": "list", "slunce": "slunce", "mrak": "mrak", "kapka": "kapka", "ryba": "ryba", "motyl": "motýl", "beruska": "beruška", "ptak": "pták", "auto": "auto", "lod": "loď", "letadlo": "letadlo", "dum": "dům", "mic": "míč", "hrnek": "hrnek", "destnik": "deštník", "klic": "klíč", "balon": "balón", "kruh": "kruh", "ctverec": "čtverec", "trojuhelnik": "trojúhelník", "hvezda": "hvězda", "srdce": "srdce", "kosoctverec": "kosočtverec"};

/* ---------- drobné pomůcky ---------- */
const $ = s => document.querySelector(s);
const el = (t, tr, html) => {
  const e = document.createElement(t);
  if (tr) e.className = tr;
  if (html != null) e.innerHTML = html;
  return e;
};
const nah = a => a[Math.floor(Math.random() * a.length)];
const michej = a => { a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]]; } return a; };
const vzorek = (a, n) => michej(a).slice(0, n);
const cele = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

function svgIkona(jmeno, vel, barva, otoc) {
  const t = otoc ? ` style="transform:rotate(${otoc}deg)"` : "";
  return `<svg viewBox="0 0 100 100" width="${vel}" height="${vel}" fill="none"
    stroke="${barva || "currentColor"}" stroke-width="4.6" stroke-linecap="round"
    stroke-linejoin="round" color="${barva || "currentColor"}"${t}>${IKONY[jmeno]}</svg>`;
}
const hvezdaSvg = (vel, vypln) => `<svg viewBox="0 0 100 100" width="${vel}"
  height="${vel}" fill="${vypln || "none"}" stroke="currentColor" stroke-width="7"
  stroke-linejoin="round"><path d="M50 10 L61 38 L91 39 L67 57 L76 86 L50 69
  L24 86 L33 57 L9 39 L39 38 Z"/></svg>`;

/* ---------- zvuk ---------- */
let zvukZap = true, ac = null;
function ton(f, delka, kdy = 0, hlas = .16) {
  if (!zvukZap) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = f;
    const t0 = ac.currentTime + kdy;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(hlas, t0 + .015);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + delka);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + delka + .05);
  } catch (e) {}
}
const zvukOk = () => { ton(660, .14); ton(880, .22, .11); };
const zvukNe = () => ton(196, .2, 0, .12);
const zvukHotovo = () => [523, 659, 784, 1046].forEach((f, i) => ton(f, .3, i * .12));

/* ---------- řeč (pokud ji zařízení umí) ---------- */
function rekni(text) {
  if (!zvukZap || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "cs-CZ"; u.rate = .92;
    const h = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("cs"));
    if (h) u.voice = h;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- uložené hvězdy ---------- */
function nactiHvezdy() {
  try { return parseInt(localStorage.getItem("honzik-hvezdy") || "0", 10) || 0; }
  catch (e) { return 0; }
}
function ulozHvezdy(n) {
  try { localStorage.setItem("honzik-hvezdy", String(n)); } catch (e) {}
}
let hvezdyCelkem = nactiHvezdy();

/* ---------- obtížnost ---------- */
let obtiznost = "snadna";
try { obtiznost = localStorage.getItem("honzik-uroven") || "snadna"; } catch (e) {}
const tezke = () => obtiznost === "tezka";
function nastavUroven(u) {
  obtiznost = u;
  try { localStorage.setItem("honzik-uroven", u); } catch (e) {}
  document.querySelectorAll("#uroven button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.u === u)));
}

/* ---------- přidání na plochu ----------
   Prohlížeč pošle beforeinstallprompt, až stránka běží přes https a má
   manifest i service worker. Sám vyskočit nesmí, musí to spustit klepnutí,
   proto se na úvodní obrazovce objeví tlačítko. */
let udalostInstalace = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  udalostInstalace = e;
  if (!stav) domu();
});
window.addEventListener("appinstalled", () => {
  udalostInstalace = null;
  if (!stav) domu();
});
async function nainstaluj() {
  if (!udalostInstalace) return;
  const e = udalostInstalace;
  udalostInstalace = null;
  try { e.prompt(); await e.userChoice; } catch (err) {}
  if (!stav) domu();
}

  ovoce:    ["jablko", "hruska", "banan", "tresne", "hrozen"],
  rostliny: ["strom", "jehlicnan", "kvetina", "list"],
  zvirata:  ["ryba", "motyl", "beruska", "ptak"],

  pocasi:   ["slunce", "mrak", "kapka"],
  veci:     ["dum", "mic", "hrnek", "destnik", "klic", "balon"],
  tvary:    ["kruh", "ctverec", "trojuhelnik", "hvezda", "srdce", "kosoctverec"]
};
const VSE = Object.values(KAT).flat();
const DVOJICE = [
  ["jablko", "strom"], ["ryba", "kapka"], ["destnik", "mrak"],
  ["klic", "dum"], ["motyl", "kvetina"], ["beruska", "list"]
];

/* Pořadí dlaždic jde od nejlehčího úkolu po nejtěžší. */
const HRY = [
  {
    id: "nepatri", jm: "Co sem nepatří", kat: "třídění", ikona: "jablko", kol: 8,
    zadani: "Klepni na to, co sem nepatří.",
    uloha(k) {
      /* Snadná úroveň: dvě náhodné kategorie, vetřelec bije do očí.
         Těžší: dvojice kategorií, které k sobě mají blízko — auto mezi
         domem, míčem a klíčem je taky "věc", rozdíl je jemnější. */
      const blizke = [["ovoce", "rostliny"], ["veci", "doprava"],
                      ["pocasi", "rostliny"], ["zvirata", "rostliny"],
                      ["doprava", "veci"], ["rostliny", "ovoce"]];
      const klice = tezke()
        ? nah(blizke)
        : michej(Object.keys(KAT).filter(x => x !== "tvary")).slice(0, 2);
      const cizi = nah(KAT[klice[1]]);
      return { moznosti: michej(vzorek(KAT[klice[0]], 3).concat([cizi])),
               spravne: cizi, typ: "ikona" };
    }
  },
  {
    id: "stopa", jm: "Kresli po stopě", kat: "uvolnění ruky", ikona: "kapka", kol: 4,
    zadani: "Veď prstem po šedé cestě od tečky až na konec.", vlastni: true
  },
  {
    id: "vic", jm: "Čeho je víc", kat: "porovnávání", ikona: "hrozen", kol: 8,
    zadani: "Klepni na stranu, kde je víc obrázků.",
    uloha(k) {
      const rozdil = tezke() ? (k < 4 ? cele(2, 4) : 1) : cele(3, 5);
      const a = tezke() ? cele(3, 8) : cele(2, 6);
      const b = Math.random() < .5
        ? Math.min(11, a + rozdil) : Math.max(1, a - rozdil);
      if (a === b) return this.uloha(k);
      return { a, b, ikona: nah(VSE), spravne: a > b ? "a" : "b", typ: "vic" };
    }
  },
  {
    id: "pocitej", jm: "Spočítej", kat: "počet", ikona: "hvezda", kol: 8,
    zadani: "Spočítej obrázky a klepni na správné číslo.",
    uloha(k) {
      const n = tezke()
        ? (k < 3 ? cele(2, 5) : k < 6 ? cele(3, 7) : cele(4, 10))
        : (k < 4 ? cele(2, 4) : cele(3, 6));
      const strop = tezke() ? 10 : 7;
      const spatne = new Set();
      while (spatne.size < 2) {
        const c = n + nah([-2, -1, 1, 2]);
        if (c >= 1 && c <= strop && c !== n) spatne.add(c);
      }
      return { pocet: n, ikona: nah(VSE),
               moznosti: michej([n].concat([...spatne])), spravne: n,
               typ: "cislo" };
    }
  },
  {
    id: "stejny", jm: "Najdi stejný", kat: "rozlišování", ikona: "ctverec", kol: 8,
    zadani: "Který obrázek je úplně stejný jako ten nahoře?",
    uloha(k) {
      /* kulaté a souměrné obrázky sem nepatří – po otočení vypadají stejně */
      const vzor = nah(VSE.filter(x =>
        !["kruh", "mic", "slunce", "ctverec", "kosoctverec"].includes(x)));
      /* Snadná: jedna otočená kopie a dva úplně jiné obrázky.
         Těžší: dvě otočené kopie a jen jeden jiný — musí se dívat pozorněji. */
      const moznosti = [{ jm: vzor, otoc: 0, spr: true }];
      if (tezke()) {
        const uhly = vzorek([90, 135, 45, 225], 2);
        uhly.forEach(u => moznosti.push({ jm: vzor, otoc: u, spr: false }));
        moznosti.push({ jm: nah(VSE.filter(x => x !== vzor)), otoc: 0, spr: false });
      } else {
        moznosti.push({ jm: vzor, otoc: 180, spr: false });
        vzorek(VSE.filter(x => x !== vzor), 2)
          .forEach(j => moznosti.push({ jm: j, otoc: 0, spr: false }));
      }
      return { vzor, moznosti: michej(moznosti), typ: "stejny" };
    }
  },
  {
    id: "rozdil", jm: "Najdi rozdíl", kat: "zrak", ikona: "motyl", kol: 6,
    zadani: "Mřížky jsou skoro stejné. Najdi, co je jinak.",
    uloha(k) {
      const poli = tezke() ? 9 : 6;
      const devet = [];
      for (let i = 0; i < poli; i++) devet.push(nah(VSE));
      const kde = cele(0, poli - 1);
      let novy = nah(VSE);
      while (novy === devet[kde]) novy = nah(VSE);
      const druha = devet.slice(); druha[kde] = novy;
      return { horni: devet, dolni: druha, spravne: kde, typ: "rozdil" };
    }
  },
  {
    id: "pexeso", jm: "Pexeso", kat: "paměť", ikona: "mrak", kol: 1,
    zadani: "Najdi dvojice stejných obrázků.", vlastni: true
  },
  {
    id: "dvojice", jm: "Co k sobě patří", kat: "logika", ikona: "klic", kol: 6,
    zadani: "Co k tomuhle obrázku patří?",
    uloha(k) {
      const [a, b] = DVOJICE[k % DVOJICE.length];
      const jine = vzorek(VSE.filter(x => x !== a && x !== b), tezke() ? 3 : 2);
      return { vzor: a, moznosti: michej([b].concat(jine)), spravne: b,
               typ: "ikona" };
    }
  },
  {
    id: "rada", jm: "Co patří dál", kat: "posloupnost", ikona: "kosoctverec", kol: 8,
    zadani: "Obrázky se pravidelně střídají. Co patří do prázdného rámečku?",
    uloha(k) {
      /* Perioda vzoru musí dělit délku řady beze zbytku (6 = 2×3 = 3×2).
         Jinak se některý tvar objeví v řadě jen jednou a když zrovna on
         zmizí do díry, úloha nemá jednoznačné řešení. Proto žádná perioda 4. */
      const p = vzorek(KAT.tvary, 3);
      const vzory = tezke()
        ? [[0,1], [0,0,1], [0,1,2], [0,1,1]]
        : [[0,1], [0,0,1], [0,1,1]];
      const v = vzory[k % vzory.length];
      const P = v.length;
      const rada = [];
      for (let i = 0; i < 6; i++) rada.push(p[v[i % P]]);

      /* na těžší úrovni chybí od poloviny hry obrázek uprostřed řady, ne na
         konci — to se nedá vyřešit pohledem na poslední dva, musí se poznat
         pravidlo. Na snadné úrovni je díra vždy na konci. */
      let kde = (!tezke() || k < 4) ? 5 : cele(2, 4);
      /* pojistka: díra smí být jen tam, kde totéž místo v jiné periodě vidím */
      const urcene = i => [0,1,2,3,4,5].some(j => j !== i && j % P === i % P);
      if (!urcene(kde)) kde = [0,1,2,3,4,5].filter(urcene).pop();
      const spravne = rada[kde];

      /* nabídka je jen z tvarů, které v řadě jsou (plus nanejvýš jeden navíc
         ze stejné rodiny) — jinak by se dalo uhodnout bez přemýšlení */
      const videt = rada.filter((_, i) => i !== kde);
      const moznosti = [...new Set(videt)];
      if (!moznosti.includes(spravne)) moznosti.push(spravne);
      const zbyle = michej(KAT.tvary.filter(x => !moznosti.includes(x)));
      while (moznosti.length < 3 && zbyle.length) moznosti.push(zbyle.pop());

      return { rada, kde, moznosti: michej(moznosti), spravne, typ: "rada" };
    }
  },
];

/* =====================================================================
   Domovská obrazovka

function domu() {
  stav = null;
  $("#app").classList.add("domovska");
  $("#zpet").classList.remove("vid");
  $("#nadpis").textContent = "Honzíkovy úkoly";
  obnovLista();
  scena.innerHTML = "";

  const w = el("div", "wrap");
  const u = el("div", "uvod", `<h2>Co si dneska zkusíme?</h2>
    <p>Devět úkolů na myšlení, pozornost a uvolnění ruky, seřazených
    od nejlehčího. Každý má pár kol a na konci hvězdičky.<br>
    Nahoře se přepíná obtížnost — začni na <b>snadné</b>.</p>`);
  w.appendChild(u);

  if (udalostInstalace) {
    const bar = el("div", "instalace");
    bar.appendChild(el("span", null, "Chceš appku jako ikonu na ploše?"));
    const b = el("button", "tl hl", "Přidat na plochu");
    b.onclick = nainstaluj;
    bar.appendChild(b);
    w.appendChild(bar);
  }

  const g = el("div", "dlazdice");
  HRY.forEach(h => {
    const b = el("button", "hra-t");
    b.innerHTML = svgIkona(h.ikona, 46) +
      `<span class="jm">${h.jm}</span><span class="kat">${h.kat}</span>`;
    b.onclick = () => spustHru(h);
    g.appendChild(b);
  });
  w.appendChild(g);
  scena.appendChild(w);
}

/* =====================================================================
   Průběh hry
   ===================================================================== */
function spustHru(h) {
  stav = { hra: h, kolo: 0, chyb: 0, hotovo: false };
  $("#app").classList.remove("domovska");
  $("#zpet").classList.add("vid");
  $("#nadpis").textContent = h.jm;
  dalsiKolo();
}

function dalsiKolo() {
  const h = stav.hra;
  if (stav.kolo >= h.kol) return odmena();
  scena.innerHTML = "";
  const w = el("div", "wrap");

  const z = el("div", "zadani");
  z.innerHTML = `<p>${h.zadani}</p>
    <button aria-label="Přečíst zadání nahlas">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9 L8 9 L13 5 L13 19 L8 15 L4 15 Z"/>
    <path d="M17 9 C19 12 19 12 17 15"/></svg></button>`;
  z.querySelector("button").onclick = () => rekni(h.zadani);
  w.appendChild(z);

  const p = el("div", "plocha");
  w.appendChild(p);

  const post = el("div", "postup");
  for (let i = 0; i < h.kol; i++) {
    const t = el("div", "tecka" + (i < stav.kolo ? " hot" : i === stav.kolo ? " ted" : ""));
    post.appendChild(t);
  }
  w.appendChild(post);
  scena.appendChild(w);

  if (h.id === "pexeso") return hraPexeso(p);
  if (h.id === "stopa") return hraStopa(p);
  vykresliUlohu(p, h.uloha(stav.kolo));
}

function uspech() {
  zvukOk(); razitko(true);
  setTimeout(() => { stav.kolo++; dalsiKolo(); }, 620);
}
function neuspech(uzel) {
  zvukNe(); stav.chyb++;
  uzel.classList.add("ne");
  setTimeout(() => uzel.classList.remove("ne"), 420);
}

/* ---------- vykreslení jednoho kola ---------- */
function vykresliUlohu(p, u) {
  if (u.typ === "rada") {
    const r = el("div", "ram");
    const dira = `<svg viewBox="0 0 100 100" width="48" height="48" fill="none"
      stroke="var(--linka)" stroke-width="6" stroke-dasharray="10 9"
      stroke-linecap="round"><rect x="10" y="10" width="80" height="80" rx="14"/></svg>`;
    u.rada.forEach((x, i) => { r.innerHTML += i === u.kde ? dira : svgIkona(x, 48); });
    p.appendChild(r);
  } else if (u.typ === "cislo") {
    const r = el("div", "ram");
    let s = "";
    for (let i = 0; i < u.pocet; i++) s += svgIkona(u.ikona, 42);
    r.innerHTML = s;
    p.appendChild(r);
  } else if (u.typ === "stejny" || (u.vzor && u.typ === "ikona")) {
    const v = el("div", "vzor plny");
    v.innerHTML = svgIkona(u.vzor, 64);
    p.appendChild(v);
  } else if (u.typ === "vic") {
    const g = el("div", "volby");
    g.style.gridTemplateColumns = "1fr 1fr";
    ["a", "b"].forEach(k => {
      const b = el("button", "volba skupina");
      b.style.minHeight = "clamp(150px,26vh,230px)";
      b.style.flexWrap = "wrap";
      b.style.gap = "8px";
      let s = "";
      for (let i = 0; i < u[k]; i++) s += svgIkona(u.ikona, 34);
      b.innerHTML = s;
      b.onclick = () => {
        if (k === u.spravne) { b.classList.add("ok"); uspech(); }
        else neuspech(b);
      };
      g.appendChild(b);
    });
    p.appendChild(g);
    return;
  } else if (u.typ === "rozdil") {
    const d = el("div", "dvojplocha");
    [["horni", false, "vzor"], ["dolni", true, "tady klepni"]]
      .forEach(([klic, klikaci, popis]) => {
      const sloupec = el("div");
      sloupec.appendChild(el("div", "popis-plochy", popis));
      const m = el("div", "ram");
      m.style.padding = "10px";
      const mr = el("div", "mrizka9");
      mr.style.width = "100%";
      u[klic].forEach((ik, i) => {
        const c = el(klikaci ? "button" : "div", "pole" + (klikaci ? " klik" : ""));
        c.innerHTML = svgIkona(ik, 38);
        if (klikaci) c.onclick = () => {
          if (i === u.spravne) { c.classList.add("ok"); uspech(); }
          else neuspech(c);
        };
        mr.appendChild(c);
      });
      m.appendChild(mr);
      sloupec.appendChild(m);
      d.appendChild(sloupec);
    });
    p.appendChild(d);
    return;
  }

  /* volby */
  const g = el("div", "volby");
  const n = u.moznosti.length;
  g.style.gridTemplateColumns = n === 4 ? "repeat(2,1fr)" : "repeat(3,1fr)";
  u.moznosti.forEach(m => {
    const b = el("button", "volba");
    if (u.typ === "cislo") b.innerHTML = `<span class="cis">${m}</span>`;
    else if (u.typ === "stejny") b.innerHTML = svgIkona(m.jm, 58, null, m.otoc);
    else b.innerHTML = svgIkona(m, 58);
    b.onclick = () => {
      const spr = u.typ === "stejny" ? m.spr : m === u.spravne;
      if (spr) { b.classList.add("ok"); uspech(); } else neuspech(b);
    };
    g.appendChild(b);
  });
  p.appendChild(g);
}

/* =====================================================================
   Pexeso
   ===================================================================== */
function hraPexeso(p) {
  const kolikParu = tezke() ? 6 : 4;
  const pary = vzorek(VSE, kolikParu);
  const karty = michej(pary.concat(pary));
  let prvni = null, blok = false, nalezeno = 0;

  const g = el("div", "karty");
  karty.forEach(jm => {
    const k = el("button", "karta");
    k.innerHTML = svgIkona(jm, 40) +
      `<span class="rub">${hvezdaSvg(26, "currentColor")}</span>`;
    k.dataset.jm = jm;
    k.onclick = () => {
      if (blok || k.classList.contains("otoc")) return;
      k.classList.add("otoc"); ton(720, .1);
      if (!prvni) { prvni = k; return; }
      if (prvni.dataset.jm === jm) {
        prvni.classList.add("nalez"); k.classList.add("nalez");
        prvni = null; nalezeno++;
        zvukOk();
        if (nalezeno === kolikParu) {
          setTimeout(() => { stav.kolo = 1; odmena(); }, 500);
        }
      } else {
        blok = true; zvukNe();
        const a = prvni; prvni = null;
        setTimeout(() => {
          a.classList.remove("otoc"); k.classList.remove("otoc"); blok = false;
        }, 850);
      }
    };
    g.appendChild(k);
  });
  p.appendChild(g);
}

/* =====================================================================
   Kresli po stopě
   ===================================================================== */
function hraStopa(p) {
  const box = el("div", "platno-box");
  const cv = document.createElement("canvas");
  box.appendChild(cv);
  p.appendChild(box);

  requestAnimationFrame(() => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const W = box.clientWidth, H = box.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);

    const styl = getComputedStyle(document.documentElement);
    const cLinka = styl.getPropertyValue("--linka").trim() || "#DCD2C1";
    const cInk = styl.getPropertyValue("--ink").trim() || "#241F1A";
    const cModra = styl.getPropertyValue("--modra").trim() || "#3C6FA6";
    const cZelena = styl.getPropertyValue("--zelena").trim() || "#3E8B5B";

    /* na snadné úrovni je cesta širší a stačí se jí držet volněji */
    const sirkaCesty = tezke() ? 22 : 34;
    const tolerance = tezke() ? 26 : 38;

    const okraj = 46, sirka = W - okraj * 2, vyska = H - okraj * 2;
    const druhy = ["vlna", "smycky", "spirala", "cikcak"];
    const druh = druhy[stav.kolo % druhy.length];
    const body = [];
    const N = 260;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      let x, y;
      if (druh === "vlna") {
        x = okraj + t * sirka;
        y = okraj + vyska / 2 - Math.sin(t * Math.PI * 4) * vyska * .33;
      } else if (druh === "smycky") {
        x = okraj + t * sirka + Math.sin(t * Math.PI * 12) * sirka * .035;
        y = okraj + vyska / 2 - Math.abs(Math.sin(t * Math.PI * 6)) * vyska * .42;
      } else if (druh === "spirala") {
        const u = t * Math.PI * 2 * 2.6;
        const r = Math.min(sirka, vyska) / 2 * (t * .96);
        x = okraj + sirka / 2 + Math.cos(u) * r;
        y = okraj + vyska / 2 + Math.sin(u) * r;
      } else {
        x = okraj + t * sirka;
        const f = ((t * 5) % 1) < .5 ? (t * 5 % 1) * 2 : 2 - (t * 5 % 1) * 2;
        y = okraj + vyska * .12 + f * vyska * .7;
      }
      body.push({ x, y });
    }

    const kontroly = [];
    for (let i = 0; i < body.length; i += 10) kontroly.push(body[i]);
    kontroly.push(body[body.length - 1]);
    let dalsi = 0, kresli = false;
    const tahy = [];

    function prekresli() {
      ctx.clearRect(0, 0, W, H);
      /* cesta */
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.strokeStyle = cLinka; ctx.lineWidth = sirkaCesty;
      ctx.beginPath(); ctx.moveTo(body[0].x, body[0].y);
      body.forEach(b => ctx.lineTo(b.x, b.y));
      ctx.stroke();
      /* dětská čára */
      ctx.strokeStyle = cModra; ctx.lineWidth = 9;
      tahy.forEach(t => {
        if (t.length < 2) return;
        ctx.beginPath(); ctx.moveTo(t[0].x, t[0].y);
        t.forEach(b => ctx.lineTo(b.x, b.y));
        ctx.stroke();
      });
      /* start a cíl */
      ctx.fillStyle = cZelena;
      ctx.beginPath(); ctx.arc(body[0].x, body[0].y, 13, 0, 7); ctx.fill();
      ctx.strokeStyle = cInk; ctx.lineWidth = 4;
      const k = body[body.length - 1];
      ctx.beginPath(); ctx.arc(k.x, k.y, 13, 0, 7); ctx.stroke();
      /* kolik zbývá */
      const hotovo = dalsi / kontroly.length;
      ctx.fillStyle = cZelena;
      ctx.fillRect(0, H - 6, W * hotovo, 6);
    }
    prekresli();

    const pozice = e => {
      const r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    };
    cv.addEventListener("pointerdown", e => {
      cv.setPointerCapture(e.pointerId);
      kresli = true; tahy.push([pozice(e)]); prekresli();
    });
    cv.addEventListener("pointermove", e => {
      if (!kresli) return;
      const b = pozice(e);
      tahy[tahy.length - 1].push(b);
      while (dalsi < kontroly.length) {
        const c = kontroly[dalsi];
        if (Math.hypot(b.x - c.x, b.y - c.y) < tolerance) {
          dalsi++; ton(520 + dalsi * 14, .05, 0, .07);
        }
        else break;
      }
      prekresli();
      if (dalsi >= kontroly.length) {
        kresli = false;
        setTimeout(() => { stav.kolo++; dalsiKolo(); }, 350);
        zvukOk(); razitko(true);
      }
    });
    cv.addEventListener("pointerup", () => { kresli = false; });
    cv.addEventListener("pointercancel", () => { kresli = false; });
  });
}

/* =====================================================================
   Odměna
   ===================================================================== */
function odmena() {
  const h = stav.hra;
  const ziskane = stav.chyb === 0 ? 3 : stav.chyb <= 2 ? 2 : 1;
  hvezdyCelkem += ziskane; ulozHvezdy(hvezdyCelkem); obnovLista();
  zvukHotovo();

  scena.innerHTML = "";
  const w = el("div", "wrap");
  const o = el("div", "odmena");
  const hv = el("div", "hvezdy-rada");
  for (let i = 0; i < 3; i++) {
    const s = el("span", null, hvezdaSvg(52, i < ziskane ? "var(--zluta)" : "none"));
    s.querySelector("svg").style.animationDelay = (i * .13) + "s";
    s.style.color = i < ziskane ? "var(--zluta)" : "var(--linka)";
    hv.appendChild(s);
  }
  o.appendChild(hv);
  const nadpis = ziskane === 3 ? "Bez jediné chyby!"
    : ziskane === 2 ? "Moc pěkně!" : "Hotovo!";
  o.appendChild(el("h2", null, nadpis));
  o.appendChild(el("p", null,
    `${h.jm} máš za sebou. Celkem už jsi nasbíral <b>${hvezdyCelkem}</b> hvězdiček.`));

  const t = el("div", "tlacitka");
  const znovu = el("button", "tl hl", "Ještě jednou");
  znovu.onclick = () => spustHru(h);
  const zpet = el("button", "tl", "Vybrat jinou hru");
  zpet.onclick = domu;
  t.appendChild(znovu); t.appendChild(zpet);
  o.appendChild(t);
  w.appendChild(o);
  scena.appendChild(w);
  rekni(nadpis);
}
