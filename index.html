<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FBF7EF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikona-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="ikona-192.png">
</head>
<body>
<title>Honzíkovy úkoly</title>

<style>
/* ---------- barvy: inkoust na papíře, stejný svět jako tištěné listy ---------- */
:root{
  --papir:#FBF7EF;
  --karta:#FFFDF8;
  --ink:#241F1A;
  --ink2:#7D7266;
  --linka:#DCD2C1;
  --zelena:#3E8B5B;
  --cervena:#C5533B;
  --zluta:#DDA12A;
  --modra:#3C6FA6;
  --stin:#CBBDA4;
  /* barvy obrázků – na papíře musí být dost tmavé, aby byly čitelné */
  --b-cervena:#C4402F; --b-oranzova:#CC7327; --b-zluta:#BC8F1F;
  --b-zelena:#3F8B4F;  --b-tyrkys:#2C8880;   --b-modra:#3A6FA8;
  --b-fialova:#7A5AA8; --b-ruzova:#BB5179;   --b-hneda:#8A6647;
  --b-seda:#6B635A;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papir:#15130F;
    --karta:#211D18;
    --ink:#F4EDE1;
    --ink2:#A2978A;
    --linka:#3B342B;
    --zelena:#5FB37E;
    --cervena:#E0745B;
    --zluta:#EBBB57;
    --modra:#6C9CD0;
    --stin:#0D0B09;
    /* na tmavém pozadí musí být tytéž barvy naopak světlé */
    --b-cervena:#E8836F; --b-oranzova:#E9A45E; --b-zluta:#E0BE58;
    --b-zelena:#6FBE80;  --b-tyrkys:#5CBDB5;   --b-modra:#7BA9DC;
    --b-fialova:#A98FD6; --b-ruzova:#E089AC;   --b-hneda:#BC9370;
    --b-seda:#A2978A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --papir:#15130F; --karta:#211D18; --ink:#F4EDE1; --ink2:#A2978A;
  --linka:#3B342B; --zelena:#5FB37E; --cervena:#E0745B; --zluta:#EBBB57;
  --modra:#6C9CD0; --stin:#0D0B09;
  --b-cervena:#E8836F; --b-oranzova:#E9A45E; --b-zluta:#E0BE58;
  --b-zelena:#6FBE80;  --b-tyrkys:#5CBDB5;   --b-modra:#7BA9DC;
  --b-fialova:#A98FD6; --b-ruzova:#E089AC;   --b-hneda:#BC9370;
  --b-seda:#A2978A;
  color-scheme: dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:var(--papir);
  color:var(--ink);
  font-family:Pismo,"Segoe UI",system-ui,-apple-system,sans-serif;
  font-weight:400;
  overscroll-behavior:none;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--modra);outline-offset:3px}

#app{height:100%;display:flex;flex-direction:column}

/* ---------- horní lišta ---------- */
#lista{
  flex:0 0 auto;
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;
  border-bottom:2px solid var(--linka);
  background:var(--karta);
}
#zpet{
  width:44px;height:44px;flex:0 0 auto;
  border:2.5px solid var(--ink);border-radius:14px;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 3px 0 var(--stin);
}
#zpet.vid{display:flex}
#zpet:active{transform:translateY(3px);box-shadow:none}
#nadpis{
  flex:1;min-width:0;
  font-weight:700;font-size:clamp(17px,2.4vw,22px);
  letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.odznak{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  font-weight:700;font-size:16px;
  border:2.5px solid var(--ink);border-radius:999px;
  padding:5px 13px 5px 10px;
  box-shadow:0 3px 0 var(--stin);
}
#zvuk{
  width:44px;height:44px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  border:2.5px solid var(--ink);border-radius:14px;
  box-shadow:0 3px 0 var(--stin);
}

/* přepínač obtížnosti – jen na úvodní obrazovce, ať ho nikdo
   nepřeklikne uprostřed hry */
#uroven{
  display:none;flex:0 0 auto;gap:0;
  border:2.5px solid var(--ink);border-radius:999px;
  box-shadow:0 3px 0 var(--stin);overflow:hidden;
}
#app.domovska #uroven{display:flex}
#uroven button{
  padding:7px 14px;font-size:13px;font-weight:600;
  color:var(--ink2);background:transparent;
}
#uroven button[aria-pressed="true"]{background:var(--ink);color:var(--papir)}
@media (max-width:600px){
  #app.domovska #nadpis{display:none}
  #uroven button{padding:7px 11px;font-size:12px}
}

/* ---------- scéna ---------- */
#scena{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:16px;
  display:flex;flex-direction:column;
}
.wrap{width:100%;max-width:860px;margin:0 auto;flex:1;
      display:flex;flex-direction:column;gap:14px}

/* ---------- domovská obrazovka ---------- */
.uvod{text-align:center;padding:6px 0 2px}
.uvod h2{margin:0 0 4px;font-size:clamp(22px,4vw,30px);font-weight:700;
         letter-spacing:-.02em;text-wrap:balance}
.uvod p{margin:0;color:var(--ink2);font-size:14px;line-height:1.5}

/* nabídka přidat appku na plochu – objeví se, až to prohlížeč dovolí */
.instalace{
  display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  border:2.5px dashed var(--ink);border-radius:18px;
  padding:12px 16px;
}
.instalace span{font-size:14px;font-weight:600}

/* ---------- velká cesta ---------- */
.cesta-nabidka{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:color-mix(in srgb, var(--zluta) 13%, var(--karta));
  border:2.5px solid var(--ink);border-radius:20px;
  box-shadow:0 4px 0 var(--stin);
  padding:14px 18px;
}
.cesta-nabidka .txt{flex:1;min-width:190px}
.cesta-nabidka b{display:block;font-size:17px;margin-bottom:2px}
.cesta-nabidka span{font-size:13px;color:var(--ink2);line-height:1.45}

.cesta-postup{padding:2px 0 4px}
.cesta-popis{
  display:flex;justify-content:space-between;gap:10px;
  font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px;
}
.pruh{
  height:11px;border:2px solid var(--ink);border-radius:999px;
  overflow:hidden;background:var(--karta);
}
.pruh i{display:block;height:100%;background:var(--zelena);
        transition:width .35s ease}

/* ---------- přehled pro rodiče ---------- */
#rodic{
  display:none;width:44px;height:44px;flex:0 0 auto;
  align-items:center;justify-content:center;
  border:2.5px solid var(--ink);border-radius:14px;
  box-shadow:0 3px 0 var(--stin);
}
#app.domovska #rodic{display:flex}

.prehled h3{margin:0 0 3px;font-size:15px;font-weight:700}
.prehled .pozn{margin:0 0 10px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.karta-box{
  background:var(--karta);border:2.5px solid var(--ink);border-radius:18px;
  box-shadow:0 4px 0 var(--stin);padding:14px 16px;
}
.oblast-radek{
  display:grid;grid-template-columns:1fr 34% 54px;align-items:center;gap:10px;
  padding:7px 0;border-bottom:1px solid var(--linka);
}
.oblast-radek:last-child{border-bottom:none}
.oblast-radek .jm{font-size:13.5px;font-weight:600}
.oblast-radek .det{font-size:11px;color:var(--ink2)}
.oblast-radek .hod{font-size:14px;font-weight:700;text-align:right;
                   font-variant-numeric:tabular-nums}
.mini{height:9px;border-radius:999px;background:var(--linka);overflow:hidden}
.mini i{display:block;height:100%;border-radius:999px}
.behy{display:flex;align-items:flex-end;justify-content:flex-start;
      gap:6px;height:70px}
.behy div{flex:1 1 0;max-width:40px;background:var(--modra);
          border-radius:4px 4px 0 0;min-height:4px}
.rada-doporuceni{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6}
.rada-doporuceni li{margin-bottom:4px}

/* devět dlaždic: na tabletu 3×3 beze zbytku, na telefonu dva sloupce
   a poslední dlaždice přes celou šířku, ať nezůstane osamocená */
.dlazdice{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media (min-width:620px){
  .dlazdice{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:619px){
  .dlazdice > :last-child{grid-column:span 2}
}
.hra-t{
  --tb:var(--ink);
  background:color-mix(in srgb, var(--tb) 11%, var(--karta));
  border:2.5px solid color-mix(in srgb, var(--tb) 60%, var(--ink));
  border-radius:20px;
  box-shadow:0 4px 0 color-mix(in srgb, var(--tb) 30%, var(--stin));
  padding:18px 12px 15px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:transform .12s ease,box-shadow .12s ease;
}
.hra-t:active{transform:translateY(4px);box-shadow:0 0 0 var(--stin)}
.hra-t .jm{font-weight:700;font-size:15px;text-align:center;line-height:1.25}
.hra-t .kat{
  font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:color-mix(in srgb, var(--tb) 65%, var(--ink2));
}
.hra-t svg{display:block}

/* ---------- zadání ---------- */
.zadani{
  display:flex;align-items:center;gap:10px;
  background:var(--karta);
  border:2.5px solid var(--ink);border-radius:16px;
  box-shadow:0 4px 0 var(--stin);
  padding:11px 14px;
}
.zadani p{margin:0;flex:1;font-weight:600;font-size:clamp(15px,2vw,18px);line-height:1.3}
.zadani button{
  flex:0 0 auto;width:40px;height:40px;border-radius:12px;
  border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;
}

/* ---------- herní plocha ---------- */
.plocha{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;
        min-height:0;padding:4px 0}

.volby{display:grid;gap:12px}
.volba{
  background:var(--karta);
  border:3px solid var(--ink);
  border-radius:22px;
  box-shadow:0 5px 0 var(--stin);
  min-height:clamp(104px,17vh,168px);
  display:flex;align-items:center;justify-content:center;
  padding:12px;
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;
}

/* velikosti obrázků – ať jsou na tabletu pořádně velké */
.hra-t svg{width:clamp(46px,7vw,72px);height:auto}
.volba svg{width:clamp(58px,11vw,112px);height:auto}
.vzor svg,.vzor.plny svg{width:clamp(68px,13vw,124px);height:auto}
.ram svg{width:clamp(34px,6vw,60px);height:auto}
.pole svg{width:clamp(30px,5.5vw,58px);height:auto}
.karta svg{width:clamp(38px,8vw,76px);height:auto}
.karta .rub svg{width:clamp(24px,4vw,38px)}
.skupina svg{width:clamp(30px,5.5vw,56px);height:auto}
.volba:active{transform:translateY(4px);box-shadow:0 0 0 var(--stin)}
.volba.ok{border-color:var(--zelena);animation:buch .45s ease}
.volba.ne{border-color:var(--cervena);animation:klepani .4s ease}
.volba.zhasle{opacity:.32}
.volba .cis{font-size:clamp(34px,7vw,52px);font-weight:700;line-height:1}

.ram{
  background:var(--karta);
  border:3px solid var(--ink);border-radius:20px;
  box-shadow:0 4px 0 var(--stin);
  padding:14px;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:10px;min-height:clamp(110px,16vh,160px);
}
.vzor{
  background:var(--karta);
  border:3px dashed var(--linka);border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  padding:14px;min-height:clamp(112px,17vh,168px);
}
.vzor.plny{border-style:solid;border-color:var(--ink);box-shadow:0 4px 0 var(--stin)}

@keyframes buch{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}
@keyframes klepani{0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ---------- postup ---------- */
.postup{display:flex;gap:7px;justify-content:center;padding:2px 0 4px;flex-wrap:wrap}
.tecka{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--ink);
       background:transparent}
.tecka.hot{background:var(--zelena);border-color:var(--zelena)}
.tecka.ted{background:var(--ink)}

/* ---------- razítko ---------- */
#razitko{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  pointer-events:none;z-index:50;
}
#razitko.vid{display:flex}
#razitko svg{animation:otisk .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes otisk{0%{transform:scale(.3) rotate(-22deg);opacity:0}
  55%{transform:scale(1.12) rotate(-7deg);opacity:1}
  100%{transform:scale(1) rotate(-7deg);opacity:1}}

/* ---------- odměna ---------- */
.odmena{flex:1;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:18px;text-align:center}
.odmena h2{margin:0;font-size:clamp(26px,6vw,40px);font-weight:700;letter-spacing:-.02em}
.odmena p{margin:0;color:var(--ink2);font-size:15px;max-width:34ch;line-height:1.5}
.hvezdy-rada{display:flex;gap:10px}
.hvezdy-rada svg{animation:skok .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes skok{from{transform:scale(0) rotate(-40deg);opacity:0}}
.tlacitka{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tl{
  border:3px solid var(--ink);border-radius:16px;
  box-shadow:0 4px 0 var(--stin);
  padding:13px 22px;font-weight:700;font-size:16px;background:var(--karta);
}
.tl:active{transform:translateY(4px);box-shadow:0 0 0 var(--stin)}
.tl.hl{background:var(--ink);color:var(--papir)}

/* ---------- pexeso ---------- */
.karty{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:600px;
       margin:0 auto;width:100%}
.popis-plochy{font-size:11px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink2);text-align:center;margin-bottom:6px}
.karta{
  aspect-ratio:1;border:3px solid var(--ink);border-radius:18px;
  background:var(--karta);box-shadow:0 4px 0 var(--stin);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.karta .rub{position:absolute;inset:0;display:flex;align-items:center;
            justify-content:center;background:var(--ink);color:var(--papir)}
.karta.otoc .rub{display:none}
.karta.nalez{border-color:var(--zelena);opacity:.55}

/* ---------- kreslení ---------- */
.platno-box{
  flex:1;min-height:230px;border:3px solid var(--ink);border-radius:20px;
  box-shadow:0 4px 0 var(--stin);background:var(--karta);overflow:hidden;
  position:relative;touch-action:none;
}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ---------- mřížky rozdílů ---------- */
.dvojplocha{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:520px){.dvojplocha{grid-template-columns:1fr}}
.mrizka9{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pole{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:12px;border:2px solid transparent;
}
.pole.klik:active{transform:scale(.94)}
.pole.ok{border-color:var(--zelena);background:color-mix(in srgb,var(--zelena) 14%,transparent)}
.pole.ne{animation:klepani .4s ease}

/* ---------- oddíly na domovské obrazovce ---------- */
.sekce{padding:10px 2px 0}
.sekce b{display:block;font-size:15px;font-weight:700;margin-bottom:2px}
.sekce span{font-size:12.5px;color:var(--ink2);line-height:1.45}
.dlazdice.ctyri{grid-template-columns:repeat(2,1fr)}
@media (min-width:620px){.dlazdice.ctyri{grid-template-columns:repeat(4,1fr)}}
@media (max-width:619px){.dlazdice.ctyri > :last-child{grid-column:auto}}

/* ---------- počítadlo nad hrou ---------- */
.pocitadlo{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--karta);border:2.5px solid var(--ink);border-radius:999px;
  box-shadow:0 4px 0 var(--stin);padding:7px 18px;
  flex:0 0 auto;align-self:center;
  font-size:14px;font-weight:600;color:var(--ink2);
}
.pocitadlo .cis{font-size:21px;font-weight:700;color:var(--ink);
                font-variant-numeric:tabular-nums}
.pocitadlo svg{width:36px;height:36px;flex:0 0 auto}
.stitek{text-align:center;font-size:clamp(14px,1.9vw,17px);font-weight:600;
        color:var(--ink2);min-height:1.4em}

/* ---------- Najdi všechny ---------- */
.lovna{display:grid;gap:8px;width:100%;max-width:620px;margin:0 auto}
.lovna button{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  background:var(--karta);border:2.5px solid var(--linka);border-radius:14px;
  transition:transform .12s ease,border-color .12s ease,background .2s ease;
}
.lovna button svg{width:76%;height:auto}
.lovna button:active{transform:scale(.93)}
.lovna button.nalez{border-color:var(--zelena);
  background:color-mix(in srgb,var(--zelena) 17%,var(--karta))}
.lovna button.ne{border-color:var(--cervena);animation:klepani .4s ease}

/* ---------- Počkej si ---------- */
.jeviste{
  flex:0 0 auto;height:clamp(230px,44vh,420px);
  display:flex;align-items:center;justify-content:center;
  background:var(--karta);border:3px dashed var(--linka);border-radius:26px;
  transition:border-color .1s ease,background .1s ease;
}
.jeviste.plno{border-style:solid;border-color:var(--ink);box-shadow:0 5px 0 var(--stin)}
.jeviste svg{width:clamp(130px,30vw,260px);height:auto}
.jeviste.ok{border-color:var(--zelena);
  background:color-mix(in srgb,var(--zelena) 14%,var(--karta))}
.jeviste.ne{border-color:var(--cervena);
  background:color-mix(in srgb,var(--cervena) 12%,var(--karta))}

/* ---------- Pamatuj si pořadí ---------- */
.ctyrka{display:grid;grid-template-columns:1fr 1fr;gap:14px;
        max-width:440px;margin:0 auto;width:100%}
.ctyrka button{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border:3px solid var(--ink);border-radius:22px;background:var(--karta);
  box-shadow:0 5px 0 var(--stin);
  transition:transform .12s ease,background .12s ease;
}
.ctyrka button svg{width:54%;height:auto}
.ctyrka button.sviti{transform:scale(1.07)}
.ctyrka.ceka button{pointer-events:none}
.ctyrka button.ne{animation:klepani .4s ease;border-color:var(--cervena)}

/* ---------- Co se změnilo ---------- */
.pamet-mrizka{display:grid;gap:10px;width:100%;max-width:540px;margin:0 auto}
.pamet-mrizka > *{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  background:var(--karta);border:2.5px solid var(--linka);border-radius:16px;
  transition:border-color .12s ease,background .2s ease;
}
.pamet-mrizka > * svg{width:68%;height:auto}
.pamet-mrizka > *.ok{border-color:var(--zelena);
  background:color-mix(in srgb,var(--zelena) 17%,var(--karta))}
.pamet-mrizka > *.ne{border-color:var(--cervena);animation:klepani .4s ease}
.odpocet{
  height:10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;
  background:var(--karta);max-width:540px;margin:0 auto;width:100%;flex:0 0 auto;
}
.odpocet i{display:block;height:100%;background:var(--modra);width:100%}

/* ---------- verbální hry ---------- */
/* velké tlačítko s obrázkem, na které se dá klepnout, aby slovo znovu zaznělo */
.slovo{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:var(--karta);border:3px solid var(--ink);border-radius:24px;

/* ---------- zvuk ---------- */

function ton(f, delka, kdy = 0, hlas = .16) {
  if (!zvukZap) return;

    ac = ac || new (window.AudioContext || window.webkitAudioContext)();

/* ---------- přidání na plochu ----------
   Prohlížeč pošle beforeinstallprompt, až stránka běží přes https a má
   manifest i service worker. Sám vyskočit nesmí, musí to spustit klepnutí,
   proto se na úvodní obrazovce objeví tlačítko. */
let udalostInstalace = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  udalostInstalace = e;
  if (!stav) domu();
});
window.addEventListener("appinstalled", () => {
  udalostInstalace = null;
  if (!stav) domu();
});
async function nainstaluj() {
  if (!udalostInstalace) return;
  const e = udalostInstalace;
  udalostInstalace = null;
  try { e.prompt(); await e.userChoice; } catch (err) {}
  if (!stav) domu();
}

      const blizke = [["ovoce", "rostliny"], ["veci", "doprava"],

  },
  {
    id: "stopa", oblast: "ruka", jm: "Kresli po stopě", kat: "uvolnění ruky", ikona: "kapka", barva: "tyrkys", listy: "1–5", kol: 4,
    zadani: "Veď prstem po šedé cestě od tečky až na konec.", vlastni: true
  },
  {
    id: "vic", oblast: "matematika", jm: "Čeho je víc", kat: "porovnávání", ikona: "hrozen", barva: "fialova", listy: "12", kol: 8,
    zadani: "Klepni na stranu, kde je víc obrázků.",
    uloha(k) {
      const rozdil = tezke() ? (k < 4 ? cele(2, 4) : 1) : cele(3, 5);
      const a = tezke() ? cele(3, 8) : cele(2, 6);
      const b = Math.random() < .5
        ? Math.min(11, a + rozdil) : Math.max(1, a - rozdil);
      if (a === b) return this.uloha(k);
      return { a, b, ikona: nah(VSE), spravne: a > b ? "a" : "b", typ: "vic" };
    }
  },
  {
    id: "pocitej", oblast: "matematika", jm: "Spočítej", kat: "počet", ikona: "hvezda", barva: "zluta", listy: "11, 13 a 14", kol: 8,
    zadani: "Spočítej obrázky a klepni na správné číslo.",
    uloha(k) {
      const n = tezke()
        ? (k < 3 ? cele(2, 5) : k < 6 ? cele(3, 7) : cele(4, 10))
        : (k < 4 ? cele(2, 4) : cele(3, 6));
      const strop = tezke() ? 10 : 7;
      const spatne = new Set();
      while (spatne.size < 2) {
        const c = n + nah([-2, -1, 1, 2]);
        if (c >= 1 && c <= strop && c !== n) spatne.add(c);
      }
      return { pocet: n, ikona: nah(VSE),
               moznosti: michej([n].concat([...spatne])), spravne: n,
               typ: "cislo" };
    }
  },
  {
    id: "stejny", oblast: "matematika", jm: "Najdi stejný", kat: "rozlišování", ikona: "ctverec", barva: "modra", listy: "8", kol: 8,
    zadani: "Který obrázek je úplně stejný jako ten nahoře?",
    uloha(k) {
      /* kulaté a souměrné obrázky sem nepatří – po otočení vypadají stejně */
      const vzor = nah(VSE.filter(x =>
        !["kruh", "mic", "slunce", "ctverec", "kosoctverec"].includes(x)));
      /* Snadná: jedna otočená kopie a dva úplně jiné obrázky.
         Těžší: dvě otočené kopie a jen jeden jiný — musí se dívat pozorněji. */
      const moznosti = [{ jm: vzor, otoc: 0, spr: true }];
      if (tezke()) {
        const uhly = vzorek([90, 135, 45, 225], 2);
        uhly.forEach(u => moznosti.push({ jm: vzor, otoc: u, spr: false }));
        moznosti.push({ jm: nah(VSE.filter(x => x !== vzor)), otoc: 0, spr: false });
      } else {
        moznosti.push({ jm: vzor, otoc: 180, spr: false });
        vzorek(VSE.filter(x => x !== vzor), 2)
          .forEach(j => moznosti.push({ jm: j, otoc: 0, spr: false }));
      }
      return { vzor, moznosti: michej(moznosti), typ: "stejny" };
    }
  },
  {
    id: "rozdil", oblast: "matematika", jm: "Najdi rozdíl", kat: "zrak", ikona: "motyl", barva: "oranzova", listy: "6", kol: 6,
    zadani: "Mřížky jsou skoro stejné. Najdi, co je jinak.",
    uloha(k) {
      const poli = tezke() ? 9 : 6;
      const devet = [];
      for (let i = 0; i < poli; i++) devet.push(nah(VSE));
      const kde = cele(0, poli - 1);
      let novy = nah(VSE);
      while (novy === devet[kde]) novy = nah(VSE);
      const druha = devet.slice(); druha[kde] = novy;
      return { horni: devet, dolni: druha, spravne: kde, typ: "rozdil" };
    }
  },
  {
    id: "pexeso", oblast: "pamet", jm: "Pexeso", kat: "paměť", ikona: "mrak", barva: "zelena", listy: "", kol: 1,
    zadani: "Najdi dvojice stejných obrázků.", vlastni: true
  },
  {
    id: "dvojice", oblast: "logika", jm: "Co k sobě patří", kat: "logika", ikona: "klic", barva: "ruzova", listy: "20", kol: 6,
    zadani: "Co k tomuhle obrázku patří?",
    uloha(k) {
      const [a, b] = DVOJICE[k % DVOJICE.length];
      const jine = vzorek(VSE.filter(x => x !== a && x !== b), tezke() ? 3 : 2);
      return { vzor: a, moznosti: michej([b].concat(jine)), spravne: b,
               typ: "ikona" };
    }
  },
  {
    id: "rada", oblast: "logika", jm: "Co patří dál", kat: "posloupnost", ikona: "kosoctverec", barva: "hneda", listy: "9", kol: 8,
    zadani: "Obrázky se pravidelně střídají. Co patří do prázdného rámečku?",
    uloha(k) {
      /* Perioda vzoru musí dělit délku řady beze zbytku (6 = 2×3 = 3×2).
         Jinak se některý tvar objeví v řadě jen jednou a když zrovna on
         zmizí do díry, úloha nemá jednoznačné řešení. Proto žádná perioda 4. */
      const p = vzorek(KAT.tvary, 3);
      const vzory = tezke()
        ? [[0,1], [0,0,1], [0,1,2], [0,1,1]]
        : [[0,1], [0,0,1], [0,1,1]];
      const v = vzory[k % vzory.length];
      const P = v.length;
      const rada = [];
      for (let i = 0; i < 6; i++) rada.push(p[v[i % P]]);

      /* na těžší úrovni chybí od poloviny hry obrázek uprostřed řady, ne na
         konci — to se nedá vyřešit pohledem na poslední dva, musí se poznat
         pravidlo. Na snadné úrovni je díra vždy na konci. */
      let kde = (!tezke() || k < 4) ? 5 : cele(2, 4);
      /* pojistka: díra smí být jen tam, kde totéž místo v jiné periodě vidím */
      const urcene = i => [0,1,2,3,4,5].some(j => j !== i && j % P === i % P);
      if (!urcene(kde)) kde = [0,1,2,3,4,5].filter(urcene).pop();
      const spravne = rada[kde];

      /* nabídka je jen z tvarů, které v řadě jsou (plus nanejvýš jeden navíc
         ze stejné rodiny) — jinak by se dalo uhodnout bez přemýšlení */
      const videt = rada.filter((_, i) => i !== kde);
      const moznosti = [...new Set(videt)];
      if (!moznosti.includes(spravne)) moznosti.push(spravne);
      const zbyle = michej(KAT.tvary.filter(x => !moznosti.includes(x)));
      while (moznosti.length < 3 && zbyle.length) moznosti.push(zbyle.pop());

      return { rada, kde, moznosti: michej(moznosti), spravne, typ: "rada" };
    }
  },
];

  const cv = el("div", "cesta-nabidka");
  cv.style.background = "color-mix(in srgb, var(--modra) 12%, var(--karta))";
  cv.innerHTML =
    svgIkona("mic", 40, "var(--modra)") +
    `<span class="txt"><b>Cvičení soustředění</b>` +
    `<span>Všechny čtyři hry po jednom kole, tak na tři minuty. ` +
    `Taky pevná skladba, takže je vidět posun.</span></span>`;
  const tlCv = el("button", "tl hl", "Začít");
  tlCv.onclick = spustSoustredeni;
  cv.appendChild(tlCv);
  w.appendChild(cv);

  w.appendChild(dlazdice(HRY_POZOR, "ctyri"));

  w.appendChild(el("div", "sekce",
    "<b>Na talentovky</b><span>Tři oblasti, které se u zkoušek sledují: " +
    "pravidla a vztahy, počty a tvary, a řeč.</span>"));

  const zk = el("div", "cesta-nabidka");
  zk.style.background = "color-mix(in srgb, var(--zelena) 12%, var(--karta))";
  zk.innerHTML =
    svgIkona("klic", 40, "var(--zelena)") +
    `<span class="txt"><b>Zkouška nanečisto</b>` +
    `<span>Patnáct úloh ze všech tří oblastí. Na konci je vidět ` +
    `zvlášť logika, počty a řeč — tedy to, co zkouší škola.</span></span>`;
  const tlZk = el("button", "tl hl", "Vyzkoušet");
  tlZk.onclick = spustZkousku;
  zk.appendChild(tlZk);
  w.appendChild(zk);

  w.appendChild(dlazdice(HRY_ZKOUSKA, "ctyri"));
  scena.appendChild(w);
}

/* =====================================================================
   Průběh hry
   ===================================================================== */
/* Jedna hra: pořadí druhů úloh se zamíchá, ať se to nenaučí nazpaměť. */
function spustHru(h) {
  const polozky = michej([...Array(h.kol).keys()]).map(k => ({ h, k }));
  spust("hra", h.jm, polozky);
}

/* Velká cesta: pevná skladba — tři kola z každé hry, kde to dává smysl,
   u kreslení tři dráhy a u pexesa jedna deska. Skladba je vždycky stejná,
   mění se jen konkrétní úlohy, takže jdou jednotlivé cesty porovnávat. */
const CESTA_KOL = { pexeso: 1, stopa: 3 };
function spustCestu() {
  const polozky = [];
  michej(HRY).forEach(h => {
    const kolik = CESTA_KOL[h.id] || 3;
    michej([...Array(h.kol).keys()]).slice(0, kolik)
      .forEach(k => polozky.push({ h, k }));
  });
  spust("cesta", "Velká cesta", polozky);
}

/* Cvičení soustředění: od každé hry jedno kolo. Hry na soustředění trvají
   samy o sobě dýl než jedno kolo „Spočítej", takže čtyři kola jsou tak na
   tři minuty — krátké schválně, ať se dá dokončit i ve špatný den. */
function spustSoustredeni() {
  const polozky = michej(HRY_POZOR).map(h => ({ h, k: cele(0, h.kol - 1) }));
  spust("soustredeni", "Cvičení soustředění", polozky);
}

/* Zkouška nanečisto: pět úloh z každé ze tří oblastí, které Svět vzdělání
   u talentovek sleduje. Skladba je pevná, aby šly jednotlivé zkoušky
   porovnávat; pořadí se míchá, ať to není pokaždé stejná jízda.
   Sudoku tu schválně není — trvá řádově dýl než ostatní úlohy a jedna
   dlouhá položka mezi patnácti krátkými by zkoušku rozhodila. */
const ZKOUSKA_SKLADBA = [
  ["nepatri", 1], ["rada", 1], ["dvojice", 1], ["matice", 2],
  ["pocitej", 2], ["vic", 1], ["stejny", 1], ["rozdil", 1],
  ["slabiky", 2], ["hlaska", 2], ["veta", 1],
];
const hraPodleId = id => VSECHNY_HRY.find(h => h.id === id);

function spustZkousku() {
  const polozky = [];
  ZKOUSKA_SKLADBA.forEach(([id, kolik]) => {
    const h = hraPodleId(id);
    michej([...Array(h.kol).keys()]).slice(0, kolik)
      .forEach(k => polozky.push({ h, k }));
  });
  spust("zkouska", "Zkouška nanečisto", michej(polozky));
}

/* Sečte výsledky běhu po oblastech (logika / matematika / řeč). */
function podleOblasti(tally) {
  const out = {};
  for (const [id, t] of Object.entries(tally)) {
    const h = hraPodleId(id);
    if (!h || !t.uloh) continue;
    const o = out[h.oblast] || (out[h.oblast] = { uloh: 0, naPrvni: 0 });
    o.uloh += t.uloh; o.naPrvni += t.naPrvni;
  }
  return out;
}

function spust(rezim, nadpis, polozky) {
  stav = {
    rezim, nadpis, polozky, index: 0,
    chybVKole: 0, casOdpovedi: 0, zacatekUlohy: 0,
    tally: {}   /* { hraId: {uloh, naPrvni} } za tenhle běh */
  };
  $("#app").classList.remove("domovska");
  $("#zpet").classList.add("vid");
  $("#nadpis").textContent = nadpis;
  dalsiPolozku();
}

function pridejVysledek(hraId, naPrvni, cas) {
  const t = stav.tally[hraId] || (stav.tally[hraId] = { uloh: 0, naPrvni: 0 });
  t.uloh++; if (naPrvni) t.naPrvni++;
  zapisUlohu(hraId, naPrvni, cas);
}
function pridejPodil(hraId, podil, uloh, cas) {
  const t = stav.tally[hraId] || (stav.tally[hraId] = { uloh: 0, naPrvni: 0 });
  t.uloh += uloh; t.naPrvni += podil * uloh;
  zapisPodil(hraId, podil, uloh, cas);
}

function dalsiPolozku() {
  zrusCasovace();
  if (stav.index >= stav.polozky.length) return odmena();
  const { h, k } = stav.polozky[stav.index];
  stav.aktualni = h;
  stav.chybVKole = 0;
  stav.casOdpovedi = 0;

  scena.innerHTML = "";
  const w = el("div", "wrap");

  const z = el("div", "zadani");
  z.innerHTML = `<p>${h.zadani}</p>
    <button aria-label="Přečíst zadání nahlas">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9 L8 9 L13 5 L13 19 L8 15 L4 15 Z"/>
    <path d="M17 9 C19 12 19 12 17 15"/></svg></button>`;
  z.querySelector("button").onclick = () => rekni(h.zadani);
  w.appendChild(z);

  const p = el("div", "plocha");
  w.appendChild(p);
  w.appendChild(postupPruh());
  scena.appendChild(w);

  stav.zacatekUlohy = performance.now();
  if (h.id === "pexeso") return hraPexeso(p, k);
  if (h.id === "stopa") return hraStopa(p, k);
  if (h.id === "najdi") return hraNajdi(p, k);
  if (h.id === "pockej") return hraPockej(p, k);
  if (h.id === "poradi") return hraPoradi(p, k);
  if (h.id === "zmena") return hraZmena(p, k);
  if (h.id === "slabiky") return hraSlabiky(p, k);
  if (h.id === "hlaska") return hraHlaska(p, k);
  if (h.id === "veta") return hraVeta(p, k);
  if (h.id === "sudoku") return hraSudoku(p, k);
  stav.uloha = h.uloha(k);
  vykresliUlohu(p, stav.uloha);
}

function postupPruh() {
  const n = stav.polozky.length;
  if (stav.rezim === "hra") {
    const post = el("div", "postup");
    for (let i = 0; i < n; i++) {
      post.appendChild(el("div", "tecka" +
        (i < stav.index ? " hot" : i === stav.index ? " ted" : "")));
    }
    return post;
  }
  /* cesta má úloh moc na tečky, tak pruh a jméno právě probíhající hry */
  const box = el("div", "cesta-postup");
  box.innerHTML =
    `<div class="cesta-popis"><span>${stav.aktualni.jm}</span>` +
    `<span>${stav.index + 1} / ${n}</span></div>` +
    `<div class="pruh"><i style="width:${(stav.index / n) * 100}%"></i></div>`;
  return box;
}

/* Posun na další úlohu po doběhnutí animace. Kdyby dítě mezitím odešlo
   zpět na výběr, běh se zahodí — jinak by se sahalo do neexistujícího stavu. */
function poKole(ms) {
  const s = stav;
  pozdeji(() => {
    if (!stav || stav !== s) return;
    stav.index++; dalsiPolozku();
  }, ms);
}

function uspech() {
  const h = stav.aktualni;
  pridejVysledek(h.id, stav.chybVKole === 0, stav.casOdpovedi);
  zvukOk(); razitko(true);
  poKole(620);
}
function neuspech(uzel) {
  if (!stav.casOdpovedi) stav.casOdpovedi = performance.now() - stav.zacatekUlohy;
  zvukNe(); stav.chybVKole++;
  uzel.classList.add("ne");
  setTimeout(() => uzel.classList.remove("ne"), 420);
}
/* volá se při prvním klepnutí, ať se změří doba na rozmyšlenou */
function zaznamenejKlik() {
  if (!stav.casOdpovedi) stav.casOdpovedi = performance.now() - stav.zacatekUlohy;
}

/* ---------- vykreslení jednoho kola ---------- */
function vykresliUlohu(p, u) {
  if (u.typ === "rada") {
    const r = el("div", "ram");
    const dira = `<svg viewBox="0 0 100 100" width="48" height="48" fill="none"
      stroke="var(--linka)" stroke-width="6" stroke-dasharray="10 9"
      stroke-linecap="round"><rect x="10" y="10" width="80" height="80" rx="14"/></svg>`;
    u.rada.forEach((x, i) => { r.innerHTML += i === u.kde ? dira : svgIkona(x, 48); });
    p.appendChild(r);
  } else if (u.typ === "matice") {
    const m = el("div", "matice");
    m.style.gridTemplateColumns = `repeat(${u.sloupcu},1fr)`;
    u.bunky.forEach((x, i) => {
      const c = el("div", i === u.kde ? "dira" : "");
      if (i !== u.kde) c.innerHTML = svgIkona(x.jm, 54, x.b);
      else c.innerHTML = `<svg viewBox="0 0 100 100" width="54" height="54"
        fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"
        ><path d="M50 26 L50 74 M26 50 L74 50"/></svg>`;
      m.appendChild(c);
    });
    p.appendChild(m);
  } else if (u.typ === "cislo") {
    const r = el("div", "ram");
    let s = "";
    for (let i = 0; i < u.pocet; i++) s += svgIkona(u.ikona, 42);
    r.innerHTML = s;
    p.appendChild(r);
  } else if (u.typ === "stejny" || (u.vzor && u.typ === "ikona")) {
    const v = el("div", "vzor plny");
    v.innerHTML = svgIkona(u.vzor, 64);
    p.appendChild(v);
  } else if (u.typ === "vic") {
    const g = el("div", "volby");
    g.style.gridTemplateColumns = "1fr 1fr";
    ["a", "b"].forEach(k => {
      const b = el("button", "volba skupina");
      b.style.minHeight = "clamp(150px,26vh,230px)";
      b.style.flexWrap = "wrap";
      b.style.gap = "8px";
      let s = "";
      for (let i = 0; i < u[k]; i++) s += svgIkona(u.ikona, 34);
      b.innerHTML = s;
      b.onclick = () => {
        zaznamenejKlik();
        if (k === u.spravne) { b.classList.add("ok"); uspech(); }
        else neuspech(b);
      };
      g.appendChild(b);
    });
    p.appendChild(g);
    return;
  } else if (u.typ === "rozdil") {
    const d = el("div", "dvojplocha");
    [["horni", false, "vzor"], ["dolni", true, "tady klepni"]]
      .forEach(([klic, klikaci, popis]) => {
      const sloupec = el("div");
      sloupec.appendChild(el("div", "popis-plochy", popis));
      const m = el("div", "ram");
      m.style.padding = "10px";
      const mr = el("div", "mrizka9");
      mr.style.width = "100%";
      u[klic].forEach((ik, i) => {
        const c = el(klikaci ? "button" : "div", "pole" + (klikaci ? " klik" : ""));
        c.innerHTML = svgIkona(ik, 38);
        if (klikaci) c.onclick = () => {
          zaznamenejKlik();
          if (i === u.spravne) { c.classList.add("ok"); uspech(); }
          else neuspech(c);
        };
        mr.appendChild(c);
      });
      m.appendChild(mr);
      sloupec.appendChild(m);
      d.appendChild(sloupec);
    });
    p.appendChild(d);
    return;
  }

  /* volby */
  const g = el("div", "volby");
  const n = u.moznosti.length;
  g.style.gridTemplateColumns = n === 4 ? "repeat(2,1fr)" : "repeat(3,1fr)";
  u.moznosti.forEach(m => {
    const b = el("button", "volba");
    if (u.typ === "cislo") b.innerHTML = `<span class="cis">${m}</span>`;
    else if (u.typ === "matice") b.innerHTML = svgIkona(m.jm, 58, m.b);
    else if (u.typ === "stejny") b.innerHTML = svgIkona(m.jm, 58, null, m.otoc);
    else b.innerHTML = svgIkona(m, 58);
    b.onclick = () => {
      zaznamenejKlik();
      const spr = u.typ === "stejny" ? m.spr : m === u.spravne;
      if (spr) { b.classList.add("ok"); uspech(); } else neuspech(b);
    };
    g.appendChild(b);
  });
  p.appendChild(g);
}

/* =====================================================================
   Pexeso
   ===================================================================== */
function hraPexeso(p) {
  const kolikParu = tezke() ? 6 : 4;
  const pary = vzorek(VSE, kolikParu);
  const karty = michej(pary.concat(pary));
  let prvni = null, prvniIdx = -1, blok = false, nalezeno = 0;

  /* Otočit dvě neznámé karty a netrefit se je náhoda, ne selhání paměti.
     Za chybu se proto počítá jen neshoda dvou karet, které už dítě někdy
     vidělo — jinak by první polovina hry byla čistě o štěstí. */
  let chybPameti = 0;
  const videno = new Set();

  const g = el("div", "karty");
  karty.forEach((jm, idx) => {
    const k = el("button", "karta");
    k.innerHTML = svgIkona(jm, 40) +
      `<span class="rub">${hvezdaSvg(26, "currentColor")}</span>`;
    k.dataset.jm = jm;
    k.onclick = () => {
      if (blok || k.classList.contains("otoc")) return;
      zaznamenejKlik();
      k.classList.add("otoc"); ton(720, .1);
      if (!prvni) { prvni = k; prvniIdx = idx; return; }

      const shoda = prvni.dataset.jm === jm;
      if (!shoda && videno.has(prvniIdx) && videno.has(idx)) chybPameti++;
      videno.add(prvniIdx); videno.add(idx);

      if (shoda) {
        prvni.classList.add("nalez"); k.classList.add("nalez");
        prvni = null; nalezeno++;
        zvukOk();
        if (nalezeno === kolikParu) {
          const podil = Math.max(0, 1 - chybPameti / kolikParu);
          pridejPodil("pexeso", podil, kolikParu);
          razitko(true);
          poKole(600);
        }
      } else {
        blok = true; zvukNe();
        const a = prvni; prvni = null;
        setTimeout(() => {
          a.classList.remove("otoc"); k.classList.remove("otoc"); blok = false;
        }, 850);
      }
    };
    g.appendChild(k);
  });
  p.appendChild(g);
}

/* =====================================================================
   Kresli po stopě
   ===================================================================== */
function hraStopa(p) {
  const box = el("div", "platno-box");
  const cv = document.createElement("canvas");
  box.appendChild(cv);
  p.appendChild(box);

  requestAnimationFrame(() => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const W = box.clientWidth, H = box.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);

    const styl = getComputedStyle(document.documentElement);
    const cLinka = styl.getPropertyValue("--linka").trim() || "#DCD2C1";
    const cInk = styl.getPropertyValue("--ink").trim() || "#241F1A";
    const cModra = styl.getPropertyValue("--modra").trim() || "#3C6FA6";
    const cZelena = styl.getPropertyValue("--zelena").trim() || "#3E8B5B";

    /* na snadné úrovni je cesta širší a stačí se jí držet volněji */
    const sirkaCesty = tezke() ? 22 : 34;
    const tolerance = tezke() ? 26 : 38;

    const okraj = 46, sirka = W - okraj * 2, vyska = H - okraj * 2;
    const druhy = ["vlna", "smycky", "spirala", "cikcak"];
    const druh = druhy[stav.polozky[stav.index].k % druhy.length];
    const body = [];
    const N = 260;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      let x, y;
      if (druh === "vlna") {
        x = okraj + t * sirka;
        y = okraj + vyska / 2 - Math.sin(t * Math.PI * 4) * vyska * .33;
      } else if (druh === "smycky") {
        x = okraj + t * sirka + Math.sin(t * Math.PI * 12) * sirka * .035;
        y = okraj + vyska / 2 - Math.abs(Math.sin(t * Math.PI * 6)) * vyska * .42;
      } else if (druh === "spirala") {
        const u = t * Math.PI * 2 * 2.6;
        const r = Math.min(sirka, vyska) / 2 * (t * .96);
        x = okraj + sirka / 2 + Math.cos(u) * r;
        y = okraj + vyska / 2 + Math.sin(u) * r;
      } else {
        x = okraj + t * sirka;
        const f = ((t * 5) % 1) < .5 ? (t * 5 % 1) * 2 : 2 - (t * 5 % 1) * 2;
        y = okraj + vyska * .12 + f * vyska * .7;
      }
      body.push({ x, y });
    }

    const kontroly = [];
    for (let i = 0; i < body.length; i += 10) kontroly.push(body[i]);
    kontroly.push(body[body.length - 1]);
    let dalsi = 0, kresli = false;
    const tahy = [];

    /* Kolik z nakreslené čáry zůstalo v cestě — přímá míra vedení ruky.
       Počítá se vzdálenost každého zaznamenaného bodu k nejbližšímu
       bodu dráhy. */
    const limitVzdalenosti = sirkaCesty / 2 + 8;
    let bodyUvnitr = 0, bodyCelkem = 0;
    function zmerBod(b) {
      let nej = Infinity;
      for (let i = 0; i < body.length; i += 2) {
        const d = Math.hypot(b.x - body[i].x, b.y - body[i].y);
        if (d < nej) { nej = d; if (nej < 4) break; }
      }
      bodyCelkem++;
      if (nej <= limitVzdalenosti) bodyUvnitr++;
    }

    function prekresli() {
      ctx.clearRect(0, 0, W, H);
      /* cesta */
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.strokeStyle = cLinka; ctx.lineWidth = sirkaCesty;
      ctx.beginPath(); ctx.moveTo(body[0].x, body[0].y);
      body.forEach(b => ctx.lineTo(b.x, b.y));
      ctx.stroke();
      /* dětská čára */
      ctx.strokeStyle = cModra; ctx.lineWidth = 9;
      tahy.forEach(t => {
        if (t.length < 2) return;
        ctx.beginPath(); ctx.moveTo(t[0].x, t[0].y);
        t.forEach(b => ctx.lineTo(b.x, b.y));
        ctx.stroke();
      });
      /* start a cíl */
      ctx.fillStyle = cZelena;
      ctx.beginPath(); ctx.arc(body[0].x, body[0].y, 13, 0, 7); ctx.fill();
      ctx.strokeStyle = cInk; ctx.lineWidth = 4;
      const k = body[body.length - 1];
      ctx.beginPath(); ctx.arc(k.x, k.y, 13, 0, 7); ctx.stroke();
      /* kolik zbývá */
      const hotovo = dalsi / kontroly.length;
      ctx.fillStyle = cZelena;
      ctx.fillRect(0, H - 6, W * hotovo, 6);
    }
    prekresli();

    const pozice = e => {
      const r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    };
    cv.addEventListener("pointerdown", e => {
      cv.setPointerCapture(e.pointerId);
      zaznamenejKlik();
      kresli = true; const b = pozice(e); tahy.push([b]); zmerBod(b); prekresli();
    });
    cv.addEventListener("pointermove", e => {
      if (!kresli) return;
      const b = pozice(e);
      tahy[tahy.length - 1].push(b);
      zmerBod(b);
      while (dalsi < kontroly.length) {
        const c = kontroly[dalsi];
        if (Math.hypot(b.x - c.x, b.y - c.y) < tolerance) {
          dalsi++; ton(520 + dalsi * 14, .05, 0, .07);
        }
        else break;
      }
      prekresli();
      if (dalsi >= kontroly.length) {
        kresli = false;
        const presnost = bodyCelkem ? bodyUvnitr / bodyCelkem : 1;
        pridejPodil("stopa", presnost, 1);
        zvukOk(); razitko(true);
        poKole(350);
      }
    });
    cv.addEventListener("pointerup", () => { kresli = false; });
    cv.addEventListener("pointercancel", () => { kresli = false; });
  });
}

/* =====================================================================
   Najdi všechny
   Škrtací úloha z papíru, jen s počítadlem. Pointa není v tom poznat
   jablko — to umí hned — ale projít celé pole a neskončit v polovině.
   Proto je pořád vidět, kolik zbývá: konec je na dohled.
   ===================================================================== */
function hraNajdi(p, k) {
  const sloupcu = tezke() ? 5 : 4;
  const poli = sloupcu * sloupcu;
  const kolikCilu = tezke() ? 7 : 5;
  const cil = ["jablko", "hvezda", "motyl", "kvetina", "tresne", "ryba"][k % 6];
  /* jen čtyři druhy rušivých obrázků, ne celá knihovna — pole pak vypadá
     jako pole, ne jako smetiště, a hledá se v něm o to líp */
  const rusive = vzorek(VSE.filter(x => x !== cil), 4);

  /* rušivé obrázky rozdělím rovnoměrně, ne náhodně: jinak se jeden z nich
     objeví desetkrát, cíl pětkrát, a pole pak vypadá jako jeden druh
     s několika výjimkami — hledá se v tom snadněji, než má */
  const pole = [];
  for (let i = 0; i < poli - kolikCilu; i++) pole.push(rusive[i % rusive.length]);
  for (let i = 0; i < kolikCilu; i++) pole.push(cil);

  let naslo = 0, chyby = 0;

  const hlava = el("div", "pocitadlo");
  hlava.innerHTML = "<span>najdi všechny</span>" + svgIkona(cil, 36);
  const cis = el("span", "cis", `0 / ${kolikCilu}`);
  hlava.appendChild(cis);
  p.appendChild(hlava);

  const g = el("div", "lovna");
  g.style.gridTemplateColumns = `repeat(${sloupcu},1fr)`;
  michej(pole).forEach(jm => {
    const b = el("button");
    b.innerHTML = svgIkona(jm, 44);
    b.onclick = () => {
      if (b.classList.contains("nalez")) return;
      zaznamenejKlik();
      if (jm !== cil) {
        chyby++; zvukNe();
        b.classList.add("ne");
        pozdeji(() => b.classList.remove("ne"), 420);
        return;
      }
      b.classList.add("nalez");
      naslo++;
      cis.textContent = `${naslo} / ${kolikCilu}`;
      ton(560 + naslo * 45, .1);
      if (naslo === kolikCilu) {
        pridejPodil("najdi", Math.max(0, 1 - chyby / kolikCilu), 1,
                    performance.now() - stav.zacatekUlohy);
        zvukOk(); razitko(true);
        poKole(640);
      }
    };
    g.appendChild(b);
  });
  p.appendChild(g);
}

/* =====================================================================
   Počkej si
   Jediná hra v celé appce, kde se vyhrává tím, že člověk nic neudělá.
   Cíl se mění po kolech, mrak je pořád stejný — pravidlo „na mrak ne"
   se tak může zažít, místo aby se pokaždé učilo znovu.
   ===================================================================== */
function hraPockej(p, k) {
  const cil = ["jablko", "hruska", "tresne", "kvetina", "motyl", "balon"][k % 6];
  const kolik = tezke() ? 16 : 12;
  const doba = tezke() ? 900 : 1250;      /* jak dlouho je obrázek vidět */
  const pauza = tezke() ? 420 : 560;

  /* Mraků je přesně třetina — ne „každý s pravděpodobností třetina". Při
     náhodě by jednou vyšly dva a jindy šest, a protože se z počtu cílů
     počítá úspěšnost, nebyla by jednotlivá kola srovnatelná.
     První je vždycky cíl, ať je hned jasné, co se dělá, a nikdy nejsou
     tři mraky za sebou — to už není brzda, to je čekání. */
  const mraku = Math.round(kolik / 3);
  const cilu = kolik - mraku;
  let rada, pokus = 0;
  do {
    rada = michej(Array(cilu).fill(true).concat(Array(mraku).fill(false)));
  } while (++pokus < 60 && (!rada[0] || rada.some((_, i) =>
    i >= 2 && !rada[i] && !rada[i - 1] && !rada[i - 2])));
  /* pojistka, kdyby se to za šedesát pokusů netrefilo: prohodit, ne přepsat,
     aby počet cílů seděl s tím, co ukazuje počítadlo */
  if (!rada[0]) { const j = rada.indexOf(true); rada[j] = false; rada[0] = true; }

  let i = 0, zasah = 0, chyby = 0, aktivni = false, klepnuto = false, tik = null;

  const hlava = el("div", "pocitadlo");
  hlava.innerHTML = "<span>klepni na</span>" + svgIkona(cil, 36);
  const cis = el("span", "cis", `0 / ${cilu}`);
  hlava.appendChild(cis);
  p.appendChild(hlava);

  const jev = el("div", "jeviste");
  p.appendChild(jev);

  const pruh = el("div", "pruh");
  pruh.innerHTML = '<i style="width:0%"></i>';
  p.appendChild(pruh);

  function ukaz() {
    if (i >= kolik) return konec();
    const jeCil = rada[i];
    aktivni = true; klepnuto = false;
    jev.className = "jeviste plno";
    jev.innerHTML = svgIkona(jeCil ? cil : "mrak", 130);
    tik = pozdeji(() => {
      if (jeCil && !klepnuto) { chyby++; zvukNe(); }   /* nestihl */
      dalsiObrazek();
    }, doba);
  }
  function dalsiObrazek() {
    clearTimeout(tik);
    aktivni = false;
    jev.className = "jeviste";
    jev.innerHTML = "";
    i++;
    pruh.firstChild.style.width = (i / kolik * 100) + "%";
    pozdeji(ukaz, pauza);
  }
  jev.onclick = () => {
    if (!aktivni || klepnuto) return;
    klepnuto = true;
    zaznamenejKlik();
    if (rada[i]) {
      zasah++; cis.textContent = `${zasah} / ${cilu}`;
      jev.classList.add("ok"); ton(780, .11);
      pozdeji(dalsiObrazek, 240);
    } else {
      chyby++; zvukNe();
      jev.classList.add("ne");
      /* mrak zůstane na place do konce svého času — ať je vidět,
         že tohle byl ten, na který se nemělo klepat */
    }
  };

  function konec() {
    /* dělím alespoň čtyřmi, aby jedna chyba v krátké řadě neznamenala
       propadnutí celého kola */
    /* čas tu nezapisuji: délku kola určuje scénář, ne dítě */
    pridejPodil("pockej", Math.max(0, 1 - chyby / Math.max(4, cilu)), 1);
    zvukOk(); razitko(true);
    poKole(700);
  }

  pozdeji(ukaz, 900);   /* chvilka na rozhlédnutí, než to začne */
}

/* =====================================================================
   Pamatuj si pořadí
   Řada se po každém zvládnutém kole prodlouží o jeden obrázek. Po první
   chybě se tatáž řada přehraje ještě raz — druhá šance se počítá za půl,
   ale neukončí hru. Pětiletý potřebuje spíš opakování než verdikt.
   ===================================================================== */
function hraPoradi(p) {
  const znaky = [
    { jm: "jablko", b: "cervena", f: 392 },
    { jm: "hvezda", b: "zluta",   f: 494 },
    { jm: "kapka",  b: "modra",   f: 587 },
    { jm: "list",   b: "zelena",  f: 698 },
  ];
  const od = tezke() ? 3 : 2;
  const az = tezke() ? 6 : 5;
  const urovni = az - od + 1;

  let delka = od, skore = 0, druhyPokus = false;
  let rada = [], poz = 0, prijima = false;

  const hlava = el("div", "pocitadlo");
  hlava.innerHTML = "<span>řada</span>";
  const cis = el("span", "cis", `1 / ${urovni}`);
  hlava.appendChild(cis);
  p.appendChild(hlava);

  const g = el("div", "ctyrka ceka");
  znaky.forEach((z, idx) => {
    const b = el("button");
    b.style.borderColor = `var(--b-${z.b})`;
    b.innerHTML = svgIkona(z.jm, 60, `var(--b-${z.b})`);
    b.onclick = () => klep(idx, b);
    g.appendChild(b);
  });
  p.appendChild(g);

  const stit = el("div", "stitek", "Koukej…");
  p.appendChild(stit);

  function rozsvit(idx, ms) {
    const b = g.children[idx];
    b.classList.add("sviti");
    b.style.background =
      `color-mix(in srgb, var(--b-${znaky[idx].b}) 34%, var(--karta))`;
    ton(znaky[idx].f, .26, 0, .14);
    pozdeji(() => { b.classList.remove("sviti"); b.style.background = ""; }, ms);
  }

  function prehraj() {
    prijima = false; poz = 0;
    g.classList.add("ceka");
    stit.textContent = druhyPokus ? "Ještě jednou, koukej…" : "Koukej…";
    cis.textContent = `${delka - od + 1} / ${urovni}`;
    rada.forEach((idx, j) => pozdeji(() => rozsvit(idx, 380), 420 + j * 620));
    pozdeji(() => {
      prijima = true;
      g.classList.remove("ceka");
      stit.textContent = "Teď ty!";
    }, 420 + rada.length * 620);
  }

  function noveKolo() {
    rada = [];
    for (let j = 0; j < delka; j++) rada.push(cele(0, 3));
    /* dvakrát týž obrázek za sebou se špatně pozná, tak to rozhodím */
    for (let j = 1; j < rada.length; j++)
      if (rada[j] === rada[j - 1]) rada[j] = (rada[j] + 1 + cele(0, 2)) % 4;
    druhyPokus = false;
    prehraj();
  }

  function klep(idx, b) {
    if (!prijima) return;
    zaznamenejKlik();
    if (idx === rada[poz]) {
      rozsvit(idx, 220);
      poz++;
      if (poz < rada.length) return;
      prijima = false;
      skore += druhyPokus ? .5 : 1;
      zvukOk();
      if (delka >= az) return pozdeji(konec, 600);
      delka++;
      stit.textContent = "Teď o jeden dýl!";
      pozdeji(noveKolo, 950);
      return;
    }
    prijima = false;
    zvukNe();
    b.classList.add("ne");
    pozdeji(() => b.classList.remove("ne"), 420);
    if (!druhyPokus) { druhyPokus = true; pozdeji(prehraj, 950); }
    else pozdeji(konec, 750);
  }

  function konec() {
    /* totéž co u Počkej si — čas je dán přehráváním řady */
    pridejPodil("poradi", Math.min(1, skore / urovni), 1);
    razitko(true);
    poKole(700);
  }

  noveKolo();
}

/* =====================================================================
   Co se změnilo
   Jako „najdi rozdíl", jenom druhá mřížka nestojí vedle první, ale až
   po ní. Obrázky jsou všechny různé, aby byla výměna poznatelná —
   když se dvě jablka opakují, nejde říct, které z nich je nové.
   ===================================================================== */
function hraZmena(p) {
  const poli = tezke() ? 9 : 6;
  const ikony = vzorek(VSE, poli);
  const kde = cele(0, poli - 1);
  const novy = nah(VSE.filter(x => !ikony.includes(x)));
  const sam = dobaPamatovani === 0;      /* dítě si obrázky schová samo */
  const dobaKoukani = dobaPamatovani * 1000;
  const zakryto = `<svg viewBox="0 0 100 100" width="54" height="54" fill="none"
    stroke="var(--linka)" stroke-width="6" stroke-dasharray="10 9"
    stroke-linecap="round"><rect x="12" y="12" width="76" height="76" rx="14"/></svg>`;

  const stit = el("div", "stitek", sam
    ? "Prohlédni si obrázky. Až je budeš umět, klepni dole."
    : "Prohlédni si obrázky a pamatuj si je…");
  p.appendChild(stit);

  const g = el("div", "pamet-mrizka");
  g.style.gridTemplateColumns = "repeat(3,1fr)";
  ikony.forEach(jm => {
    const c = el("button");
    c.innerHTML = svgIkona(jm, 54);
    g.appendChild(c);
  });
  p.appendChild(g);

  let od = null, tlSchovat = null;
  if (sam) {
    tlSchovat = el("button", "tl hl", "Už to umím");
    tlSchovat.style.alignSelf = "center";
    tlSchovat.onclick = schovej;
    p.appendChild(tlSchovat);
  } else {
    /* pruh ubývá, takže je dopředu vidět, kolik času na koukání ještě je */
    od = el("div", "odpocet");
    od.innerHTML = "<i></i>";
    p.appendChild(od);
    requestAnimationFrame(() => {
      od.firstChild.style.transition = `width ${dobaKoukani}ms linear`;
      od.firstChild.style.width = "0%";
    });
    pozdeji(schovej, dobaKoukani);
  }

  function schovej() {
    if (!g.isConnected) return;
    stit.textContent = "A teď pozor…";
    if (od) od.style.visibility = "hidden";
    if (tlSchovat) tlSchovat.remove();
    [...g.children].forEach(c => { c.innerHTML = zakryto; });
    ton(300, .14);
    pozdeji(odkryj, 800);
  }

  function odkryj() {
    stit.textContent = "Který obrázek je jiný než předtím?";
    const nove = ikony.slice();
    nove[kde] = novy;
    [...g.children].forEach((c, i) => {
      c.innerHTML = svgIkona(nove[i], 54);
      c.onclick = () => {
        zaznamenejKlik();
        if (i === kde) { c.classList.add("ok"); uspech(); }
        else neuspech(c);
      };
    });
    /* čas na rozmyšlenou se měří od odkrytí, ne od začátku koukání */
    stav.zacatekUlohy = performance.now();
    stav.casOdpovedi = 0;
    ton(680, .12);
  }
}

/* =====================================================================
   Verbální hry
   Zadání se vždycky i napíše, nejen řekne. Hlas je bonus — ne každý tablet
   má českou řeč nainstalovanou, a hra, která bez ní nejde hrát, by byla
   k ničemu. Obrázek navíc slovo prozradí sám.
   ===================================================================== */
function kartaSlova(jm) {
  const k = el("button", "slovo");
  k.innerHTML = svgIkona(jm, 110) +
    `<span class="jm">${NAZVY[jm]}</span>` +
    `<span class="znovu">klepni a uslyšíš to znovu</span>`;
  k.onclick = () => rekni(NAZVY[jm]);
  pozdeji(() => rekni(NAZVY[jm]), 450);
  return k;
}

/* ---------- Kolik slabik ---------- */
function hraSlabiky(p) {
  /* na snadné úrovni jen jedno- a dvojslabičná slova */
  const pool = tezke() ? SLOVA : SLOVA.filter(x => SLABIKY[x] <= 2);
  const jm = nah(pool);
  const spravne = SLABIKY[jm];

  p.appendChild(kartaSlova(jm));
  p.appendChild(el("div", "stitek", "Kolikrát tleskneš?"));

  const g = el("div", "volby");
  g.style.gridTemplateColumns = "repeat(3,1fr)";
  [1, 2, 3].forEach(n => {
    const b = el("button", "volba");
    b.style.minHeight = "clamp(86px,13vh,130px)";
    b.innerHTML = `<span class="tlesk">${"<i></i>".repeat(n)}</span>`;
    b.onclick = () => {
      zaznamenejKlik();
      if (n === spravne) { b.classList.add("ok"); uspech(); }
      else neuspech(b);
    };
    g.appendChild(b);
  });
  p.appendChild(g);
}

/* ---------- Na jakou hlásku ---------- */
function hraHlaska(p) {
  const jm = nah(SLOVA);
  const spravne = HLASKA[jm];
  const jine = michej([...new Set(Object.values(HLASKA))]
    .filter(x => x !== spravne));
  const moznosti = michej([spravne].concat(jine.slice(0, tezke() ? 3 : 2)));

  p.appendChild(kartaSlova(jm));
  p.appendChild(el("div", "stitek", "Kterým písmenem slovo začíná?"));

  const g = el("div", "volby");
  g.style.gridTemplateColumns = `repeat(${moznosti.length},1fr)`;
  moznosti.forEach(x => {
    const b = el("button", "volba");
    b.style.minHeight = "clamp(86px,13vh,130px)";
    b.innerHTML = `<span class="pismeno">${x}</span>`;
    b.onclick = () => {
      zaznamenejKlik();
      if (x === spravne) { b.classList.add("ok"); uspech(); }
      else neuspech(b);
    };
    g.appendChild(b);
  });
  p.appendChild(g);
}

/* ---------- Poslouchej a ukaž ----------
   Věty jsou schválně jen v prvním pádě („kde je míč nahoře a dům dole"),
   aby se dalo skládat ze jmen obrázků bez skloňování. „Nad domem" by znělo
   líp, ale vyžadovalo by tvary, které by se u každého slova musely hlídat
   zvlášť — a špatně vyskloňovaná věta je u úlohy na porozumění horší vada
   než věta trochu toporná. */
const POLOHY = {
  nahore: { styl: "top:2%;left:31%",    slovo: "nahoře" },
  dole:   { styl: "bottom:2%;left:31%", slovo: "dole" },
  vlevo:  { styl: "left:3%;top:31%",    slovo: "vlevo" },
  vpravo: { styl: "right:3%;top:31%",   slovo: "vpravo" },
};
const DVOJICE_POLOH = [
  ["nahore", "dole"], ["dole", "nahore"],
  ["vlevo", "vpravo"], ["vpravo", "vlevo"],
];

function hraVeta(p) {
  const [a, b] = vzorek(VSE.filter(x => NAZVY[x]), 2);
  /* na těžší úrovni jsou čtyři obrázky a věta zmíní jen jednu polohu —
     druhou si musí domyslet */
  const kolik = tezke() ? 4 : 3;
  const varianty = michej(DVOJICE_POLOH).slice(0, kolik);
  const spravna = nah(varianty);

  const veta = tezke()
    ? `Najdi obrázek, kde je ${NAZVY[a]} ${POLOHY[spravna[0]].slovo}.`
    : `Najdi obrázek, kde je ${NAZVY[a]} ${POLOHY[spravna[0]].slovo} ` +
      `a ${NAZVY[b]} ${POLOHY[spravna[1]].slovo}.`;

  const vetaUzel = el("div", "stitek", veta);
  vetaUzel.style.fontSize = "clamp(15px,2.3vw,19px)";
  vetaUzel.style.color = "var(--ink)";
  p.appendChild(vetaUzel);

  const g = el("div", "volby");
  g.style.gridTemplateColumns = kolik === 4 ? "repeat(2,1fr)" : "repeat(3,1fr)";
  varianty.forEach(v => {
    const t = el("button", "volba");
    t.style.minHeight = "clamp(130px,21vh,200px)";
    t.innerHTML =
      `<span class="scenka">` +
      svgIkona(a, 60).replace("<svg", `<svg style="${POLOHY[v[0]].styl}"`) +
      svgIkona(b, 60).replace("<svg", `<svg style="${POLOHY[v[1]].styl}"`) +
      `</span>`;
    t.onclick = () => {
      zaznamenejKlik();
      if (v === spravna) { t.classList.add("ok"); uspech(); }
      else neuspech(t);
    };
    g.appendChild(t);
  });
  p.appendChild(g);

  const znovu = el("button", "tl");
  znovu.textContent = "Přečti větu znovu";
  znovu.style.alignSelf = "center";
  znovu.onclick = () => rekni(veta);
  p.appendChild(znovu);
  pozdeji(() => rekni(veta), 450);
}

/* =====================================================================
   Sudoku
   Latinský čtverec 4×4 ze čtyř tvarů: v každém řádku i sloupci je každý
   tvar právě jednou. Správnost kontroluju podle pravidla, ne podle toho
   jediného řešení, ze kterého jsem zadání vyrobil — po odebrání políček
   jich bývá víc a vyhodnotit dobré řešení jako chybu by bylo nefér.
   ===================================================================== */
function hraSudoku(p) {
  const N = 4;
  const tvary = vzorek(KAT.tvary, N);
  /* latinský čtverec posouváním řádků, pak zamíchat řádky i sloupce */
  let mrizka = [];
  for (let r = 0; r < N; r++) {
    const radek = [];
    for (let c = 0; c < N; c++) radek.push((r + c) % N);
    mrizka.push(radek);
  }
  const poradiR = michej([...Array(N).keys()]);
  const poradiC = michej([...Array(N).keys()]);
  mrizka = poradiR.map(r => poradiC.map(c => mrizka[r][c]));

  const prazdnych = tezke() ? 9 : 6;
  const dira = new Set(michej([...Array(N * N).keys()]).slice(0, prazdnych));
  const stav2 = mrizka.flat().map((v, i) => (dira.has(i) ? -1 : v));

  let vybrany = 0, chyby = 0;

  const hlava = el("div", "pocitadlo");
  hlava.innerHTML = "<span>zbývá</span>";
  const cis = el("span", "cis", String(prazdnych));
  hlava.appendChild(cis);
  p.appendChild(hlava);

  const g = el("div", "sudoku");
  g.style.gridTemplateColumns = `repeat(${N},1fr)`;
  stav2.forEach((v, i) => {
    const b = el("button");
    if (!dira.has(i)) b.classList.add("dano");
    b.innerHTML = v >= 0 ? svgIkona(tvary[v], 50) : "";
    b.onclick = () => klepni(i, b);
    g.appendChild(b);
  });
  p.appendChild(g);

  const paleta = el("div", "paleta");
  tvary.forEach((t, idx) => {
    const b = el("button");
    b.innerHTML = svgIkona(t, 46);
    b.setAttribute("aria-pressed", String(idx === 0));
    b.onclick = () => {
      vybrany = idx;
      [...paleta.children].forEach((x, j) =>
        x.setAttribute("aria-pressed", String(j === idx)));
      ton(700 + idx * 60, .07);
    };
    paleta.appendChild(b);
  });
  p.appendChild(paleta);
  const navod = "Vyber dole tvar a klepni, kam patří. " +
                "Klepnutím na vložený tvar ho smažeš.";
  const stit = el("div", "stitek", navod);
  p.appendChild(stit);

  const znovu = el("button", "tl");
  znovu.textContent = "Začít tabulku znovu";
  znovu.style.alignSelf = "center";
  znovu.style.display = "none";
  znovu.onclick = () => {
    [...g.children].forEach((b, i) => {
      if (dira.has(i)) { stav2[i] = -1; b.innerHTML = ""; }
    });
    cis.textContent = String(prazdnych);
    stit.textContent = navod;
    znovu.style.display = "none";
    ton(520, .12);
  };
  p.appendChild(znovu);

  const sedi = (i, v) => {
    const r = Math.floor(i / N), c = i % N;
    for (let j = 0; j < N; j++) {
      if (j !== c && stav2[r * N + j] === v) return false;
      if (j !== r && stav2[j * N + c] === v) return false;
    }
    return true;
  };

  function klepni(i, b) {
    if (!dira.has(i)) return;              /* zadané tvary jsou napevno */
    zaznamenejKlik();
    if (stav2[i] >= 0) {                   /* smazat, co tam dítě dalo */
      stav2[i] = -1; b.innerHTML = ""; ton(360, .07);
      cis.textContent = String(stav2.filter(x => x < 0).length);
      zkontrolujSlepouUlicku();
      return;
    }
    if (!sedi(i, vybrany)) {
      chyby++; zvukNe();
      b.classList.add("ne");
      pozdeji(() => b.classList.remove("ne"), 420);
      return;
    }
    stav2[i] = vybrany;
    b.innerHTML = svgIkona(tvary[vybrany], 50);
    b.classList.add("ted");
    pozdeji(() => b.classList.remove("ted"), 400);
    ton(620 + vybrany * 50, .1);
    const zbyva = stav2.filter(x => x < 0).length;
    cis.textContent = String(zbyva);
    if (zbyva === 0) {
      pridejPodil("sudoku", Math.max(0, 1 - chyby / prazdnych), 1,
                  performance.now() - stav.zacatekUlohy);
      zvukOk(); razitko(true);
      poKole(680);
      return;
    }
    zkontrolujSlepouUlicku();
  }

  /* Každý jednotlivý tah může být podle pravidla v pořádku, a přesto se jimi
     dá zabřednout do situace, kde už se nedá pokračovat. Dospělý si domyslí,
     že musí couvnout; pětiletý jen uvidí, že mu appka nic nedovolí, a vzdá
     to. Tak mu to radši řeknu — a nepočítám to jako chybu, protože to chyba
     v pravém slova smyslu není. */
  function zkontrolujSlepouUlicku() {
    const slepa = stav2.some((v, i) =>
      v < 0 && !tvary.some((_, t) => sedi(i, t)));
    stit.textContent = slepa
      ? "Tahle cesta nevyšla — některé políčko už nejde doplnit. Smaž pár tvarů, nebo začni tabulku znovu."
      : navod;
    znovu.style.display = slepa ? "" : "none";
  }
}

/* =====================================================================
   Odměna
   ===================================================================== */
function odmena() {
  const rezim = stav.rezim;
  const cesta = rezim !== "hra";
  const hra = stav.polozky[0].h;

  let uloh = 0, naPrvni = 0;
  const poOblastech = {};
  for (const [id, t] of Object.entries(stav.tally)) {
    uloh += t.uloh; naPrvni += t.naPrvni;
    poOblastech[id] = t.uloh ? t.naPrvni / t.uloh : 1;
  }
  const podil = uloh ? naPrvni / uloh : 1;
  const ziskane = hvezdyZa(podil);

  hvezdyCelkem += ziskane; ulozHvezdy(hvezdyCelkem); obnovLista();

  if (cesta) {
    vysledky.behy.push({
      datum: new Date().toISOString(),
      typ: rezim,            /* "cesta", "soustredeni" nebo "zkouska" */
      podil, uroven: obtiznost, oblasti: poOblastech,
      skupiny: podleOblasti(stav.tally)
    });
    if (vysledky.behy.length > 60) vysledky.behy = vysledky.behy.slice(-60);
    ulozVysledky();
  }
  zvukHotovo();

  scena.innerHTML = "";
  const w = el("div", "wrap");
  const o = el("div", "odmena");
  const hv = el("div", "hvezdy-rada");
  for (let i = 0; i < 3; i++) {
    const s = el("span", null, hvezdaSvg(cesta ? 64 : 52,
      i < ziskane ? "var(--zluta)" : "none"));
    s.querySelector("svg").style.animationDelay = (i * .13) + "s";
    s.style.color = i < ziskane ? "var(--zluta)" : "var(--linka)";
    hv.appendChild(s);
  }
  o.appendChild(hv);

  const nadpis = rezim === "cesta"
    ? (ziskane === 3 ? "Celou cestu bez zaváhání!"
      : ziskane === 2 ? "Cesta je za tebou!" : "Došel jsi až na konec!")
    : rezim === "soustredeni"
    ? (ziskane === 3 ? "Vydržel jsi u všeho!"
      : ziskane === 2 ? "Celé cvičení hotové!" : "Dotáhl jsi to do konce!")
    : rezim === "zkouska"
    ? (ziskane === 3 ? "Zkoušku bys dal levou zadní!"
      : ziskane === 2 ? "Zkouška je hotová!" : "Celou zkoušku jsi prošel!")
    : (ziskane === 3 ? "Bez jediné chyby!"
      : ziskane === 2 ? "Moc pěkně!" : "Hotovo!");
  o.appendChild(el("h2", null, nadpis));
  o.appendChild(el("p", null, rezim === "cesta"
    ? `Prošel jsi všech devět her. Celkem už máš <b>${hvezdyCelkem}</b> hvězdiček.`
    : rezim === "soustredeni"
    ? `Všechny čtyři hry na soustředění. Celkem už máš <b>${hvezdyCelkem}</b> hvězdiček.`
    : rezim === "zkouska"
    ? `Patnáct úloh ze tří oblastí. Celkem už máš <b>${hvezdyCelkem}</b> hvězdiček.`
    : `${hra.jm} máš za sebou. Celkem už jsi nasbíral <b>${hvezdyCelkem}</b> hvězdiček.`));

  /* U zkoušky je zajímavější než hvězdičky to, jak dopadly jednotlivé
     oblasti — právě ty škola u talentovek hodnotí zvlášť. */
  if (rezim === "zkouska") {
    const sk = podleOblasti(stav.tally);
    const box = el("div", "oblasti-vysledek");
    ["logika", "matematika", "rec"].forEach(key => {
      const o = sk[key];
      if (!o || !o.uloh) return;
      const x = o.naPrvni / o.uloh;
      const r = el("div", "r");
      r.innerHTML = `<div class="n">${OBLASTI[key]}</div>` +
        `<div class="pr"><div class="mini"><i style="width:${Math.round(x * 100)}%;` +
        `background:${barvaPodilu(x)}"></i></div>` +
        `<div class="h">${procenta(x)}</div></div>`;
      box.appendChild(r);
    });
    o.appendChild(box);
  }

  const t = el("div", "tlacitka");
  const znovu = el("button", "tl hl", "Ještě jednou");
  znovu.onclick = () => rezim === "cesta" ? spustCestu()
    : rezim === "soustredeni" ? spustSoustredeni()
    : rezim === "zkouska" ? spustZkousku() : spustHru(hra);
  const zpet = el("button", "tl", cesta ? "Zpátky na výběr" : "Vybrat jinou hru");
  zpet.onclick = domu;
  t.appendChild(znovu); t.appendChild(zpet);
  o.appendChild(t);
  w.appendChild(o);
  scena.appendChild(w);
  rekni(nadpis);
}

/* =====================================================================
   Přehled pro rodiče
   ===================================================================== */
const procenta = x => Math.round(x * 100) + " %";
const barvaPodilu = x =>
  x >= .85 ? "var(--zelena)" : x >= .6 ? "var(--zluta)" : "var(--cervena)";

function obrazovkaRodic() {
  stav = null;
  zrusCasovace();
  $("#app").classList.remove("domovska");
  $("#zpet").classList.add("vid");
  $("#nadpis").textContent = "Přehled pro rodiče";
  scena.innerHTML = "";

  const w = el("div", "wrap");
  const p = el("div", "prehled");
  p.style.display = "flex";
  p.style.flexDirection = "column";
  p.style.gap = "14px";

  p.appendChild(el("p", "pozn",
    "Výsledky se ukládají jen v tomhle tabletu a nikam se neposílají. " +
    "Berte je s rezervou — výkon pětiletého kolísá s náladou a únavou víc " +
    "než se schopnostmi, takže má smysl sledovat vývoj za delší dobu, " +
    "ne jednotlivé sezení."));

  /* ---- podle oblastí ---- */
  let nejakaData = false;
  const radekOblasti = (h, box) => {
    const o = vysledky.oblasti[h.id];
    if (!o || !o.uloh) return false;
    const u = o.naPrvni / o.uloh;
    const cas = prumernyCas(h.id);
    const r = el("div", "oblast-radek");
    r.innerHTML =
      `<div><div class="jm">${h.jm}</div>` +
      `<div class="det">${Math.round(o.uloh)} ` +
      (h.pozor ? "kol" : "úloh") +
      (cas ? ` · ${(cas / 1000).toFixed(1)} s ` +
        (h.casPopis || "na rozmyšlenou") : "") +
      `</div></div>` +
      `<div class="mini"><i style="width:${Math.round(u * 100)}%;` +
      `background:${barvaPodilu(u)}"></i></div>` +
      `<div class="hod">${procenta(u)}</div>`;
    box.appendChild(r);
    return true;
  };

  const box1 = el("div", "karta-box");
  box1.appendChild(el("h3", null, "Myšlení, zrak a ruka"));
  HRY.forEach(h => { if (radekOblasti(h, box1)) nejakaData = true; });
  if (box1.querySelectorAll(".oblast-radek").length === 0) {
    box1.appendChild(el("p", "pozn",
      "Zatím tu nic není — až si Honzík něco zahraje, objeví se to tady."));
  }
  p.appendChild(box1);

  const box1b = el("div", "karta-box");
  box1b.appendChild(el("h3", null, "Soustředění a pozornost"));
  HRY_POZOR.forEach(h => { if (radekOblasti(h, box1b)) nejakaData = true; });
  if (box1b.querySelectorAll(".oblast-radek").length === 0) {
    box1b.appendChild(el("p", "pozn",
      "Hry na soustředění zatím nehrál. U nich se nepočítají úlohy na " +
      "první pokus, ale celé kolo: kolik cílů našel a kolik mu jich " +
      "uteklo nebo kolikrát klepl vedle."));
  } else {
    box1b.appendChild(el("p", "pozn",
      "Tady procento neznamená bez chyby, ale kolik z kola vyšlo — " +
      "u Počkej si se do něj počítají i obrázky, na které nestihl klepnout."));
  }
  p.appendChild(box1b);

  const box1c = el("div", "karta-box");
  box1c.appendChild(el("h3", null, "Na talentovky"));
  HRY_ZKOUSKA.forEach(h => { if (radekOblasti(h, box1c)) nejakaData = true; });
  if (box1c.querySelectorAll(".oblast-radek").length === 0) {
    box1c.appendChild(el("p", "pozn",
      "Hry ke zkouškám zatím nehrál. Pokrývají tři oblasti, které Svět " +
      "vzdělání u talentovek sleduje: logické, matematické a verbální " +
      "předpoklady."));
  }
  p.appendChild(box1c);

  /* ---- poslední zkouška nanečisto po oblastech ---- */
  const zkousky = vysledky.behy.filter(b => b.typ === "zkouska" && b.skupiny);
  if (zkousky.length) {
    const z = zkousky[zkousky.length - 1];
    const box = el("div", "karta-box");
    box.appendChild(el("h3", null, "Poslední zkouška nanečisto"));
    box.appendChild(el("p", "pozn",
      `${new Date(z.datum).toLocaleDateString("cs-CZ")}, ` +
      `${z.uroven === "tezka" ? "těžší" : "snadná"} úroveň. Tohle jsou ` +
      "tři oblasti tak, jak je dělí škola."));
    ["logika", "matematika", "rec"].forEach(key => {
      const o = z.skupiny[key];
      if (!o || !o.uloh) return;
      const u = o.naPrvni / o.uloh;
      const r = el("div", "oblast-radek");
      r.innerHTML = `<div><div class="jm">${OBLASTI[key]}</div>` +
        `<div class="det">${Math.round(o.uloh)} úloh</div></div>` +
        `<div class="mini"><i style="width:${Math.round(u * 100)}%;` +
        `background:${barvaPodilu(u)}"></i></div>` +
        `<div class="hod">${procenta(u)}</div>`;
      box.appendChild(r);
    });
    p.appendChild(box);
  }

  /* ---- grafy dokončených sad ---- */
  const grafBehu = (typ, titul, popis) => {
    /* běhy bez „typ" jsou z doby před hrami na soustředění, tedy Velké cesty */
    const behy = vysledky.behy.filter(b => (b.typ || "cesta") === typ);
    if (!behy.length) return;
    const box = el("div", "karta-box");
    box.appendChild(el("h3", null, titul));
    box.appendChild(el("p", "pozn", popis));
    const posledni = behy.slice(-12);
    const graf = el("div", "behy");
    posledni.forEach(b => {
      const d = el("div");
      d.style.height = Math.max(4, b.podil * 100) + "%";
      d.style.background = barvaPodilu(b.podil);
      d.title = new Date(b.datum).toLocaleDateString("cs-CZ") +
        " · " + procenta(b.podil);
      graf.appendChild(d);
    });
    box.appendChild(graf);
    const p1 = posledni[posledni.length - 1];
    box.appendChild(el("p", "pozn",
      `Naposledy: <b>${procenta(p1.podil)}</b> ` +
      `(${p1.uroven === "tezka" ? "těžší" : "snadná"} úroveň, ` +
      `${new Date(p1.datum).toLocaleDateString("cs-CZ")}).`));
    p.appendChild(box);
  };
  grafBehu("cesta", "Velké cesty",
    "Každý sloupec je jedna dokončená cesta. Skladba úloh je vždycky " +
    "stejná, takže jsou porovnatelné.");
  grafBehu("zkouska", "Zkoušky nanečisto",
    "Pevná skladba patnácti úloh, pět z každé oblasti — jednotlivé zkoušky " +
    "jsou tedy porovnatelné mezi sebou. Sloupec je celkový výsledek.");
  grafBehu("soustredeni", "Cvičení soustředění",
    "Vlastní řada, oddělená od Velké cesty — ta má svou pevnou skladbu " +
    "a přidáním nových her by přestala být srovnatelná se starším měřením.");

  /* ---- na co se zaměřit ---- */
  const box3 = el("div", "karta-box");
  box3.appendChild(el("h3", null, "Na co se zaměřit"));
  /* U her na soustředění je jedna „úloha" celé kolo, kterých se za sezení
     odehraje míň — proto u nich stačí na závěr tři kola, ne šest úloh. */
  const prah = h => h.pozor ? 3 : 6;
  const slabe = VSECHNY_HRY
    .map(h => ({ h, u: uspesnostOblasti(h.id),
                 n: (vysledky.oblasti[h.id] || {}).uloh || 0 }))
    .filter(x => x.n >= prah(x.h) && x.u !== null && x.u < .8)
    .sort((a, b) => a.u - b.u)
    .slice(0, 3);

  const dostUloh = VSECHNY_HRY.filter(h =>
    ((vysledky.oblasti[h.id] || {}).uloh || 0) >= prah(h)).length;

  if (!nejakaData) {
    box3.appendChild(el("p", "pozn", "Zatím není z čeho vycházet."));
  } else if (!dostUloh) {
    box3.appendChild(el("p", "pozn",
      "Na závěry je zatím málo dat. Počítají se jen oblasti s alespoň šesti " +
      "úlohami (u her na soustředění třemi koly) — z méně by to byla náhoda, " +
      "ne zjištění. Čísla nahoře už vidět jsou, jen je zatím neberte vážně."));
  } else if (!slabe.length) {
    box3.appendChild(el("p", "pozn",
      "Nic výrazně nezaostává. Až bude úloh víc, ukáže se tu, kde to jde " +
      "pomaleji než jinde."));
  } else {
    const ul = el("ul", "rada-doporuceni");
    slabe.forEach(({ h, u }) => {
      const mn = h.listy &&
        (h.listy.includes("–") || h.listy.includes(",")) ? "listy" : "list";
      const sada = h.sada === "soustredeni" ? " ze sady na soustředění" : "";
      ul.appendChild(el("li", null,
        `<b>${h.jm}</b> (${h.kat}) — ${procenta(u)}. ` +
        (h.rada ? h.rada
          : h.listy ? `Na papíře na to sedí ${mn} ${h.listy}${sada}.`
          : "Tahle oblast nemá tištěný list, procvičí se hraním.")));
    });
    box3.appendChild(ul);
    box3.appendChild(el("p", "pozn",
      "Počítají se jen oblasti s alespoň šesti úlohami, u her na " +
      "soustředění třemi koly — z méně dat by to byla náhoda, ne zjištění."));
  }
  p.appendChild(box3);

  /* ---- nastavení ---- */
  const box4 = el("div", "karta-box");
  box4.appendChild(el("h3", null, "Doba na prohlédnutí"));
  box4.appendChild(el("p", "pozn",
    "Jak dlouho jsou vidět obrázky ve hře <b>Co se změnilo</b>, než se zakryjí. " +
    "Osm sekund na šest obrázků je rozumný začátek; na těžší úrovni jich je " +
    "devět, takže se hodí přidat. <b>Sám</b> znamená, že si je Honzík schová " +
    "klepnutím, až bude chtít — pak si tempo určuje on a nic ho nehoní."));
  const volic = el("div", "volic");
  DOBY.forEach(v => {
    const b = el("button", null, v ? v + " s" : "sám");
    b.setAttribute("aria-pressed", String(v === dobaPamatovani));
    b.onclick = () => { nastavDobu(v); ton(760, .08); obrazovkaRodic(); };
    volic.appendChild(b);
  });
  box4.appendChild(volic);
  p.appendChild(box4);

  /* ---- vymazání ---- */
  const t = el("div", "tlacitka");
  const smaz = el("button", "tl", "Vymazat výsledky");
  let potvrzeno = false;
  smaz.onclick = () => {
    if (!potvrzeno) {
      potvrzeno = true;
      smaz.textContent = "Opravdu vymazat? Klepni znovu";
      setTimeout(() => {
        potvrzeno = false; smaz.textContent = "Vymazat výsledky";
      }, 4000);
      return;
    }
    vysledky = structuredClone(PRAZDNE_VYSLEDKY);
    ulozVysledky();
    obrazovkaRodic();
  };
  const zpet = el("button", "tl hl", "Zpátky");
  zpet.onclick = domu;
  t.appendChild(zpet); t.appendChild(smaz);
  p.appendChild(t);

  w.appendChild(p);
  scena.appendChild(w);
}

/* =====================================================================
   Start
   ===================================================================== */
$("#rodic").onclick = obrazovkaRodic;
$("#zpet").onclick = domu;
document.querySelectorAll("#uroven button").forEach(b => {
  b.onclick = () => { nastavUroven(b.dataset.u); ton(760, .08); };
});
nastavUroven(obtiznost);
$("#zvuk").onclick = () => {
  zvukZap = !zvukZap;
  if (!zvukZap && "speechSynthesis" in window) speechSynthesis.cancel();
  obnovLista();
};
obnovLista();
domu();
</script>
